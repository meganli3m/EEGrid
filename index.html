    *{box-sizing:border-box;}
    body{margin:0;font-family:system-ui,-apple-system,sans-serif;background:#f9fafb;}
    .nl{background:none;border:none;border-bottom:2px solid transparent;color:rgba(255,255,255,.65);font-size:.83rem;font-weight:500;letter-spacing:.02em;padding:4px 0;cursor:pointer;transition:color .15s,border-color .15s;font-family:inherit;white-space:nowrap;}

    .qnc{transition:border-color .15s,transform .15s;cursor:pointer;}

    .kc{transition:transform .2s,border-color .2s;}
    .kc:hover{transform:translateY(-3px);border-color:#378ADD!important;}
    .tc{transition:transform .2s,border-color .2s;cursor:pointer;}
    .tc:hover{transform:translateY(-4px);border-color:#378ADD!important;}
    .stab{background:none;border:none;border-bottom:2px solid transparent;cursor:pointer;font-family:inherit;transition:color .15s,border-color .15s;border-radius:0;}
    .stab:hover,.stab.on{color:#185FA5!important;border-bottom-color:#185FA5;}
    .cbtn{transition:background .15s;cursor:pointer;}
    .cbtn:hover{background:rgba(255,255,255,.28)!important;}.cbtn.dark:hover{background:rgba(4,44,83,.2)!important;}
    .dot{cursor:pointer;transition:background .2s,transform .2s;width:7px;height:7px;border-radius:50%;background:rgba(255,255,255,.35);display:inline-block;}
    .dot.on{background:#378ADD!important;transform:scale(1.3);}
    .pbtn{cursor:pointer;transition:background .15s;}
    .pbtn:hover{background:#378ADD!important;}
    .bbtn{cursor:pointer;background:none;border:none;font-family:inherit;transition:color .15s;}
    .bbtn:hover{color:#378ADD!important;}
    .flnk{cursor:pointer;background:none;border:none;font-family:inherit;transition:color .15s;}
    .flnk:hover{color:#378ADD!important;}
    .sbar::after{content:'';display:block;width:36px;height:3px;background:#378ADD;margin-top:.6rem;border-radius:2px;}
    .il-li::before{content:'▸';color:#378ADD;margin-right:.45rem;flex-shrink:0;}
    .rt{width:100%;border-collapse:collapse;font-size:.85rem;}
    .rt th{background:#042C53;color:#fff;padding:.7rem 1rem;text-align:left;font-weight:500;}
    .rt th:first-child{border-radius:8px 0 0 0;}.rt th:last-child{border-radius:0 8px 0 0;}
    .rt td{padding:.65rem .85rem;border-bottom:.5px solid #e5e7eb;}
    .mob-menu{display:none;position:absolute;top:54px;left:0;right:0;background:#042C53;flex-direction:column;gap:0;border-bottom:.5px solid rgba(55,138,221,.2);z-index:199;}
    .mob-menu.open{display:flex;}
    .mob-menu .nl{padding:.8rem 1.5rem;border-bottom:.5px solid rgba(255,255,255,.07);border-right:none;text-align:left;width:100%;}
    .tab-bar{display:flex;overflow-x:auto;-webkit-overflow-scrolling:touch;}
    .tab-bar::-webkit-scrollbar{display:none;}

    @media(max-width:640px){
      .desktop-links{display:none!important;}
      #ham-btn{display:block!important;}
      .g2{grid-template-columns:1fr!important;}
    }

function Icon({name,size=16,color="currentColor",style={}}){
  const d=SVGS[name]||SVGS["star"];
  return(
    <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke={color} strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" style={{flexShrink:0,...style}} aria-hidden="true">
      {d.split("M").filter(Boolean).map((seg,i)=><path key={i} d={"M"+seg}/>)}
    </svg>
  );
}

function FadeUp({children,delay=0,style={}}){
  const[vis,setVis]=useState(false);
  useEffect(()=>{const t=setTimeout(()=>setVis(true),delay);return()=>clearTimeout(t);},[delay]);
  return(
    <div style={{opacity:vis?1:0,transform:vis?"translateY(0)":"translateY(22px)",transition:`opacity .65s ease, transform .65s ease`,...style}}>
      {children}
    </div>
  );
}

function Nav({page,go}){
  const[open,setOpen]=useState(false);
  const links=[{id:"home",l:"Home"},{id:"problem",l:"Problem"},{id:"solution",l:"Our Solution"},{id:"team",l:"Team"},{id:"ack",l:"Acknowledgements"}];
  const active=id=>id==="team"&&page.startsWith("member-")?true:page===id;
  const nav=id=>{go(id);setOpen(false);window.scrollTo(0,0);};
  return(
    <nav style={{position:"sticky",top:0,zIndex:200,background:C.bd,padding:"0 2rem",height:60,display:"flex",alignItems:"center",justifyContent:"space-between",borderBottom:".5px solid rgba(55,138,221,.25)"}}>
      <button style={{background:"none",border:"none",fontWeight:700,fontSize:"1.2rem",color:"#fff",letterSpacing:"-.01em",cursor:"pointer",padding:0,fontFamily:"'Space Grotesk',sans-serif"}} onClick={()=>nav("home")}>
        <span style={{color:"#fff"}}>EEG</span><em style={{fontStyle:"italic",color:"#B5D4F4"}}>rid</em>
      </button>
      <div className="desktop-links" style={{display:"flex",gap:"1.2rem"}}>
        {links.map(l=><button key={l.id} className={`nl${active(l.id)?" on":""}`} onClick={()=>nav(l.id)}>{l.l}</button>)}
      </div>
      <button id="ham-btn" style={{background:"none",border:"none",cursor:"pointer",color:"#fff",display:"none",padding:4}} onClick={()=>setOpen(o=>!o)}>
        <Icon name={open?"x":"menu"} size={22} color="#fff"/>
      </button>
      <div className={`mob-menu${open?" open":""}`}>
        {links.map(l=><button key={l.id} className={`nl${active(l.id)?" on":""}`} onClick={()=>nav(l.id)}>{l.l}</button>)}
      </div>
    </nav>
  );
}

function Footer({go}){
  const links=[{id:"home",l:"Home"},{id:"problem",l:"Problem"},{id:"solution",l:"Solution"},{id:"team",l:"Team"},{id:"ack",l:"Acknowledgements"}];
  return(
    <footer style={{background:C.bd,padding:"1.75rem 1.25rem",textAlign:"center",fontSize:".78rem",color:"rgba(255,255,255,.38)",borderTop:".5px solid rgba(55,138,221,.15)"}}>
      <strong style={{fontFamily:"'Orbitron',sans-serif",letterSpacing:".04em",fontSize:".85rem"}}><span style={{color:"#fff"}}>EEG</span><em style={{fontStyle:"italic",color:"#B5D4F4"}}>rid</em></strong> — BENG Senior Design 2026 — UC San Diego
      <div style={{marginTop:".5rem",display:"flex",justifyContent:"center",gap:"1rem",flexWrap:"wrap"}}>
        {links.map(l=><button key={l.id} className="flnk" style={{color:"rgba(255,255,255,.32)",fontSize:".78rem"}} onClick={()=>go(l.id)}>{l.l}</button>)}
      </div>
    </footer>
  );
}

function ProblemPage(){
  return(
    <>
      <PH2 title="Problem Statement" sub="Understanding the clinical need that EEGrid was designed to address"/>
      <SEC>
        <SH label="Background & Motivation" title="Why Does This Matter?"/>
        <p style={{color:"#6b7280",fontSize:".975rem",lineHeight:1.75,marginBottom:".8rem"}}>Electroencephalography (EEG) measures brain electrical activity non-invasively by placing electrodes on the scalp, capturing event-related potentials (ERPs) that are critical for assessing cognitive function, diagnosing neurological conditions, and enabling brain-computer interface (BCI) research. Despite its clinical importance, EEG adoption remains limited by a fundamental trade-off between two electrode paradigms.</p>
        <p style={{color:"#6b7280",fontSize:".975rem",lineHeight:1.75,marginBottom:".8rem"}}>Wet gel electrodes (Ag/AgCl) deliver superior signal quality but require up to 45 minutes of setup, messy conductive gels, and post-session hair cleaning. Dry electrodes offer fast, gel-free setup but suffer from high input impedance (>1 MΩ) and noise artifacts from sweat and motion. Neither system is well-suited to the 10,000–100,000 potential users in academic, educational, and hobbyist settings who require both fidelity and practicality.</p>
        <p style={{color:"#6b7280",fontSize:".975rem",lineHeight:1.75,margin:0}}>Current commercial high-fidelity EEG systems — such as the CGX Quick-20 and Biosemi Active Two — cost $10,000–$30,000 and come in fixed head sizes, requiring labs to purchase multiple headsets to accommodate different subjects. This financial barrier effectively excludes student research groups, independent researchers, and educators from accessing high-density EEG technology.</p>
        <G3>
          <KCard icon="chart-bar" title="Scale of the Problem" text="Commercial EEG systems cost $10,000–$30,000. The estimated addressable market of independent researchers, student labs, hobbyists, and educators is between 10,000 and 100,000 potential users currently priced out of the technology."/>
          <KCard icon="alert-triangle" title="Limitations of Current Solutions" text="Wet EEG requires 30–45 minutes of setup and conductive gel. Dry EEG has high impedance (>1 MΩ) and noise artifacts. Both use fixed-size caps that cannot be reconfigured for different head sizes or electrode paradigms."/>
          <KCard icon="building" title="Clinical Setting" text="EEGrid targets research labs, university classrooms, and maker/hobbyist environments. It is designed for short-to-medium duration EEG studies (30–60 minutes) requiring event-related potential (ERP) recordings such as P300, VEP, and alpha-suppression paradigms."/>
        </G3>
      </SEC>
      <HR/>
      <SEC>
        <SH label="Formal Problem Statement" title="The Challenge We're Solving"/>
        <blockquote style={{background:C.bx,borderLeft:`4px solid ${C.ba}`,borderRadius:"0 8px 8px 0",padding:"1.1rem 1.4rem",fontStyle:"italic",color:C.bm,fontSize:".9rem",marginBottom:"1.1rem",marginLeft:0,marginRight:0}}>
          "Current EEG systems present an unresolved trade-off between signal quality and usability, compounded by costs exceeding $10,000 and fixed electrode configurations that limit accessibility. There is a need for a low-cost, modular EEG headset with semi-dry electrodes that achieves clinical-grade impedance (≤30 kΩ), adapts to different head sizes and paradigms, and can be reproduced for under $400."
        </blockquote>
        <p style={{color:"#6b7280",fontSize:".975rem",lineHeight:1.75,margin:0}}>The core engineering challenge is achieving low input impedance without the mess and setup burden of traditional wet systems. A viable solution must maintain stable scalp contact through hair, sustain low impedance over a full recording session (~30–60 minutes), fit a range of head sizes without requiring multiple fixed caps, and be manufacturable at a cost accessible to non-clinical users. EEGrid addresses all four requirements simultaneously through a hybrid hydrogel-comb electrode design and a fully modular 3D-printed mechanical architecture.</p>
      </SEC>
      <HR/>
      <SEC>
        <SH label="Engineering Requirements" title="Design Constraints & Specifications"/>
        <p style={{color:"#6b7280",fontSize:".975rem",lineHeight:1.75}}>[Describe the key design requirements — performance specs, safety/regulatory constraints, cost targets, usability requirements.]</p>
        <IL items={['Effective contact impedance (ECI) ≤ 30 kΩ at the skin-electrode interface (per IEC 60601-2-26)','Total system manufacturing cost ≤ $400 (hydrogel electrodes ≤ $15 for an 8-pack)','Headset setup time ≤ 15 minutes; adjustable to fit head circumferences of 52–60 cm and nasion–inion distances of 33–39 cm','All components must be biocompatible (ISO 10993-1) and electrically safe (IEC 60601-1); data acquisition compatible with LabStreamingLayer (LSL)']}/>
      </SEC>
      <HR/>
      <SEC>
        <SH label="Broader Implications" title="Global Impact & Ethics"/>
        <G2>
          <p style={{color:"#6b7280",fontSize:".975rem",lineHeight:1.75,margin:0}}>[Potential global or societal impact. Who beyond the primary user group could benefit?]</p>
          <p style={{color:"#6b7280",fontSize:".975rem",lineHeight:1.75,margin:0}}>Neural data raises important privacy concerns: brain activity can reveal cognitive states, health conditions, and behavioral patterns. EEGrid's team has documented risks around data ownership, informed consent, and potential misuse for behavioral profiling or surveillance. All hydrogel materials must pass biocompatibility testing (ISO 10993-1) before use on human subjects. The open-source nature of the design also raises IP considerations around responsible sharing.</p>
        </G2>
      </SEC>
      <PageCredit name="Megan Liem"/>
    </>
  );
}

function SolutionPage(){
  const[tab,setTab]=useState("overview");
  return(
    <>
      <PH2 title="Our Solution" sub="Design, engineering, and implementation of EEGrid"/>
      <div className="tab-bar" style={{background:"#fff",borderBottom:".5px solid #e5e7eb",padding:"0 1.25rem",position:"sticky",top:54,zIndex:100}}>
        {[{id:"overview",l:"Overview"},{id:"technical",l:"Technical Details"},{id:"demo",l:"Demo Video"}].map(t=>(
          <button key={t.id} className={`stab${tab===t.id?" on":""}`} style={{color:"#6b7280",fontSize:".9rem",fontWeight:500,padding:".75rem 1rem",whiteSpace:"nowrap"}} onClick={()=>setTab(t.id)}>{t.l}</button>
        ))}

      {tab==="overview"&&(
        <SEC>
          <SH label="Solution Overview" title="How EEGrid Works"/>
          <G2>
            <div>
              <p style={{color:"#6b7280",fontSize:".975rem",lineHeight:1.75,marginBottom:".8rem"}}>EEGrid is a modular EEG headset with a novel semi-dry hydrogel electrode that combines the hair-parsing convenience of dry systems with the low impedance of wet systems. The device consists of two integrated subprojects: a hydrogel-based electrode assembly and a fully modular, 3D-printed mechanical headset.</p>
              <p style={{color:"#6b7280",fontSize:".975rem",lineHeight:1.75,marginBottom:".8rem"}}>The electrode uses a three-pronged comb morphology made entirely of conductive hydrogel (PEDOT:PSS + PVA + GA + DMSO + HCl), housed in a compliant rotary actuator assembly that maintains consistent scalp contact across different hair densities. An active electrode PCB with unity-gain instrumentation amplification conditions the signal locally at each electrode site before streaming to a central 8-channel breakout board via FFC connectors and LSL.</p>
              <p style={{color:"#6b7280",fontSize:".975rem",lineHeight:1.75,margin:0}}>Unlike existing semi-dry electrodes that use rigid substrates with hydrogel tips, EEGrid's electrode is constructed entirely from hydrogel — eliminating the substrate-hydrogel interface and enabling the comb prongs themselves to be conductive. At under $250 total system cost, EEGrid achieves a >95% cost reduction relative to comparable commercial systems.</p>
            </div>
            <PH icon="camera" title="System Diagram" sub="Replace with your block diagram, system overview figure, or device photo"/>
          </G2>
          <G3>
            <KCard icon="microscope" title="Hydrogel Comb Electrode" text="Three-pronged PEDOT:PSS hydrogel electrode parses through hair to reach the scalp directly, achieving 30 kΩ contact impedance — meeting IEC 60601-2-26 — without abrasive prep or conductive gel."/>
            <KCard icon="wifi" title="Feature 2" text="[Another key feature — hardware, sensing modality, algorithm, or software element.]"/>
            <KCard icon="smartphone" title="Active Electrode PCB" text="Custom PCB with unity-gain instrumentation amplifier, passive RC band-limiting filters, and FFC connectors. Validated via real-time LSL streaming with a 8-channel GUI showing measurably higher amplitude and lower noise than legacy designs."/>
          </G3>
        </SEC>
      )}
      {tab==="technical"&&(
        <SEC>
          <SH label="Technical Details" title="Design & Engineering"/>
          <p style={{color:"#6b7280",fontSize:".975rem",lineHeight:1.75}}>[Introduce the technical approach — what disciplines are involved?]</p>

          <h3 style={{fontWeight:700,fontSize:"1.5rem",color:"#042C53",marginTop:"2rem",marginBottom:"1rem",letterSpacing:"-.02em"}}>Hydrogel Electrode</h3>
          <p style={{color:"#6b7280",fontSize:".975rem",lineHeight:1.75,marginBottom:"1.5rem"}}>The hardware system integrates three subsystems: the hydrogel electrode assembly, the active electrode PCB, and the modular headset frame. Each electrode site hosts a dedicated PCB performing local signal conditioning before data is routed to a central 8-channel breakout board. The headset frame is fabricated entirely from 3D-printed PLA (rigid holders) and TPU (flexible straps), with no metal fasteners required.</p>
          <h4 style={{fontWeight:700,fontSize:"1.1rem",color:"#185FA5",marginBottom:".75rem",letterSpacing:".01em"}}>Components</h4>
          <div style={{display:"grid",gridTemplateColumns:"repeat(3,1fr)",gap:0,marginBottom:"1.25rem",border:".5px solid #e5e7eb",borderRadius:12,overflow:"hidden"}}>
            {[
              {num:"1",icon:"test-tube",title:"Hydrogel Electrode",text:"PEDOT:PSS + PVA + GA + DMSO + HCl — three-pronged comb morphology, 30 kΩ ECI, stable for 5+ days"},
              {num:"2",icon:"cpu",title:"Active Electrode PCB",text:"Unity-gain INA, RC filtering, 4-position FFC connector, fabricated via JLCPCB with in-house SMD assembly"},
              {num:"3",icon:"puzzle",title:"Modular Frame",text:"PLA electrode holders + TPU straps (20–30 mm range) — bulb-pin connector system, fits 52–60 cm circumference, nasion–inion 33–39 cm"},
            ].map((item,i)=>(

            <PH icon="cpu" title="PCB / Schematic" sub="Replace with circuit diagram or PCB layout photo" h={160}/>

          <h3 style={{fontWeight:700,fontSize:"1.5rem",color:"#042C53",marginBottom:"1rem",letterSpacing:"-.02em"}}>Adjustable Headset</h3>
          <p style={{color:"#6b7280",fontSize:".975rem",lineHeight:1.75,marginBottom:"1.5rem"}}>The headset frame is constructed entirely from 3D-printed components — rigid PLA electrode holders and flexible TPU straps — enabling a single system to be reconfigured for different head sizes and electrode paradigms without purchasing additional caps. The design accommodates head circumferences of 52–60 cm, nasion–inion distances of 33–39 cm, and tragus–tragus distances of 32–27 cm, following the 10–20 EEG placement system.</p>

          <h3 style={{fontWeight:500,fontSize:".95rem",color:"#111",marginBottom:".7rem"}}>Results & Validation</h3>
          <p style={{color:"#6b7280",fontSize:".975rem",lineHeight:1.75,marginBottom:"1rem"}}>PCB validation confirmed net continuity across all signal paths. Live acquisition testing (eyes-open/eyes-closed alpha-suppression paradigm) demonstrated measurably higher signal amplitude and reduced baseline noise from the updated active electrode PCB relative to the legacy design. Hydrogel formulation 3 (PEDOT:PSS + PVA + GA + DMSO + HCl) achieved 30 kΩ skin-electrode impedance, meeting IEC 60601-2-26 requirements, with comb morphology and structural integrity maintained for 5+ days. The headset successfully fit head circumferences of 53 cm and 58 cm in user trials, with setup time of approximately 10 minutes and user-reported comfort superior to existing dry EEG systems.</p>

function App(){
  const[page,setPage]=useState("home");
  const go=p=>{setPage(p);window.scrollTo({top:0,behavior:"smooth"});};
  const mid=page.startsWith("member-")?parseInt(page.split("-")[1]):null;
  return(
    <div style={{minHeight:"100vh",display:"flex",flexDirection:"column",background:"#f9fafb",fontFamily:"system-ui,-apple-system,sans-serif",fontSize:"16px"}}>
      <Nav page={page} go={go}/>
      <main style={{flex:1}}>
        {page==="home"&&<HomePage go={go}/>}
        {page==="problem"&&<ProblemPage/>}
        {page==="solution"&&<SolutionPage/>}
        {page==="team"&&<TeamPage go={go}/>}
        {mid!==null&&<MemberPage id={mid} go={go}/>}
        {page==="ack"&&<AckPage/>}
      </main>
      <Footer go={go}/>
    </div>
  );
}

ReactDOM.render(<App/>,document.getElementById("root"));
</script>
