    *{box-sizing:border-box;}
    body{margin:0;font-family:system-ui,-apple-system,sans-serif;background:#f9fafb;}
    .nl{background:none;border:none;border-bottom:2px solid transparent;color:rgba(255,255,255,.65);font-size:.83rem;font-weight:500;letter-spacing:.02em;padding:4px 0;cursor:pointer;transition:color .15s,border-color .15s;font-family:inherit;white-space:nowrap;}
    .nl:hover,.nl.on{color:#B5D4F4;border-bottom-color:#378ADD;}
    .qnc{transition:border-color .15s,transform .15s;cursor:pointer;}
    .qnc:hover{border-color:#378ADD!important;transform:translateY(-2px);}
    .kc{transition:transform .2s,border-color .2s;}
    .kc:hover{transform:translateY(-3px);border-color:#378ADD!important;}
    .tc{transition:transform .2s,border-color .2s;cursor:pointer;}
    .tc:hover{transform:translateY(-4px);border-color:#378ADD!important;}
    .stab{background:none;border:none;border-bottom:2px solid transparent;cursor:pointer;font-family:inherit;transition:color .15s,border-color .15s;border-radius:0;}
    .stab:hover,.stab.on{color:#185FA5!important;border-bottom-color:#185FA5;}
    .cbtn{transition:background .15s;cursor:pointer;}
    .cbtn:hover{background:rgba(255,255,255,.28)!important;}.cbtn.dark:hover{background:rgba(4,44,83,.2)!important;}
    .dot{cursor:pointer;transition:background .2s,transform .2s;width:7px;height:7px;border-radius:50%;background:rgba(255,255,255,.35);display:inline-block;}
    .dot.on{background:#378ADD!important;transform:scale(1.3);}
    .pbtn{cursor:pointer;transition:background .15s;}
    .pbtn:hover{background:#378ADD!important;}
    .bbtn{cursor:pointer;background:none;border:none;font-family:inherit;transition:color .15s;}
    .bbtn:hover{color:#378ADD!important;}
    .flnk{cursor:pointer;background:none;border:none;font-family:inherit;transition:color .15s;}
    .flnk:hover{color:#378ADD!important;}
    .sbar::after{content:'';display:block;width:36px;height:3px;background:#378ADD;margin-top:.6rem;border-radius:2px;}
    .il-li::before{content:'▸';color:#378ADD;margin-right:.45rem;flex-shrink:0;}
    .rt{width:100%;border-collapse:collapse;font-size:.85rem;}
    .rt th{background:#042C53;color:#fff;padding:.7rem 1rem;text-align:left;font-weight:500;}
    .rt th:first-child{border-radius:8px 0 0 0;}.rt th:last-child{border-radius:0 8px 0 0;}
    .rt td{padding:.65rem .85rem;border-bottom:.5px solid #e5e7eb;}
    .mob-menu{display:none;position:absolute;top:54px;left:0;right:0;background:#042C53;flex-direction:column;gap:0;border-bottom:.5px solid rgba(55,138,221,.2);z-index:199;}
    .mob-menu.open{display:flex;}
    .mob-menu .nl{padding:.8rem 1.5rem;border-bottom:.5px solid rgba(255,255,255,.07);border-right:none;text-align:left;width:100%;}
    .tab-bar{display:flex;overflow-x:auto;-webkit-overflow-scrolling:touch;}
    .tab-bar::-webkit-scrollbar{display:none;}
    .dd-wrap .dd-menu{display:none;}
    .dd-wrap:hover .dd-menu{display:block;}

    @media(max-width:640px){
      .desktop-links{display:none!important;}
      #ham-btn{display:block!important;}
      .g2{grid-template-columns:1fr!important;}
    }

}

function CropModal({src,onConfirm,onCancel,aspect:initAspect}){
  const[box,setBox]=useState({x:5,y:5,w:90,h:90});
  const[drag,setDrag]=useState(null);
  const[asp,setAsp]=useState(initAspect||"free");
  const[ready,setReady]=useState(false);
  const conRef=useRef(null);
  const imgRef=useRef(null);
  const asps={"free":null,"1:1":1,"4:3":4/3,"3:4":3/4,"16:9":16/9};
  const clamp=(v,mn,mx)=>Math.max(mn,Math.min(mx,v));

  useEffect(()=>{
    const mv=e=>{
      if(!drag||!conRef.current)return;
      const r=conRef.current.getBoundingClientRect();
      const dx=(e.clientX-drag.sx)/r.width*100;
      const dy=(e.clientY-drag.sy)/r.height*100;
      let b={...drag.b};
      const ar=asps[asp];
      if(drag.t==="move"){
        b.x=clamp(b.x+dx,0,100-b.w);
        b.y=clamp(b.y+dy,0,100-b.h);
      } else {
        if(drag.t==="se"){b.w=clamp(drag.b.w+dx,10,100-b.x);b.h=ar?b.w*(r.width/r.height)/ar:clamp(drag.b.h+dy,10,100-b.y);}
        if(drag.t==="sw"){const nw=clamp(drag.b.w-dx,10,100);b.x=drag.b.x+drag.b.w-nw;b.w=nw;b.h=ar?b.w*(r.width/r.height)/ar:clamp(drag.b.h+dy,10,100-b.y);}
        if(drag.t==="ne"){b.w=clamp(drag.b.w+dx,10,100-b.x);const nh=ar?b.w*(r.width/r.height)/ar:clamp(drag.b.h-dy,10,100);b.y=drag.b.y+drag.b.h-nh;b.h=nh;}
        if(drag.t==="nw"){const nw=clamp(drag.b.w-dx,10,100);b.x=drag.b.x+drag.b.w-nw;b.w=nw;const nh=ar?b.w*(r.width/r.height)/ar:clamp(drag.b.h-dy,10,100);b.y=drag.b.y+drag.b.h-nh;b.h=nh;}
        b.x=clamp(b.x,0,100-b.w);b.y=clamp(b.y,0,100-b.h);
        b.h=clamp(b.h,10,100-b.y);b.w=clamp(b.w,10,100-b.x);
      }
      setBox(b);
    };
    const up=()=>setDrag(null);
    document.addEventListener("mousemove",mv);
    document.addEventListener("mouseup",up);
    return()=>{document.removeEventListener("mousemove",mv);document.removeEventListener("mouseup",up);};
  },[drag,asp]);

  useEffect(()=>{
    if(!ready)return;
    const ar=asps[asp];if(!ar||!conRef.current)return;
    const r=conRef.current.getBoundingClientRect();
    if(!r.width||!r.height)return;
    setBox(b=>{
      const nh=Math.min(b.w*(r.width/r.height)/ar,100-b.y);
      return{...b,h:isFinite(nh)&&nh>0?nh:b.h};
    });
  },[asp,ready]);

  const dn=(e,t)=>{e.preventDefault();e.stopPropagation();setDrag({t,sx:e.clientX,sy:e.clientY,b:{...box}});};
  const hSz={position:"absolute",width:12,height:12,background:"#fff",border:"2px solid #378ADD",borderRadius:2,zIndex:2};

  const confirm=()=>{
    const draw=(img)=>{
      const cv=document.createElement("canvas");
      const W=img.naturalWidth,H=img.naturalHeight;
      const safe=(v,mx)=>{const n=Number(v);return isFinite(n)&&n>0?n:mx;};
      const bx=safe(box.x,0),by=safe(box.y,0);
      const bw=safe(box.w,100-bx),bh=safe(box.h,100-by);
      const x=Math.max(0,bx/100*W),y=Math.max(0,by/100*H);
      const w=Math.max(1,Math.min(W-x,bw/100*W)),h=Math.max(1,Math.min(H-y,bh/100*H));
      cv.width=Math.round(w);cv.height=Math.round(h);
      try{
        cv.getContext("2d").drawImage(img,x,y,w,h,0,0,Math.round(w),Math.round(h));
        onConfirm(cv.toDataURL("image/jpeg",0.9));
      }catch(err){
        console.error("Crop failed",err);
        onConfirm(src);
      }
    };
    const ex=imgRef.current;
    if(ex&&ex.complete&&ex.naturalWidth){draw(ex);return;}
    const img=new Image();
    img.onload=()=>draw(img);
    img.onerror=()=>onConfirm(src);
    img.src=src;
  };

  return(
    <div style={{position:"fixed",inset:0,background:"rgba(0,0,0,.82)",zIndex:9999,display:"flex",alignItems:"center",justifyContent:"center",padding:"1rem"}}
      onClick={e=>{if(e.target===e.currentTarget)onCancel();}}>
      <div style={{background:"#fff",borderRadius:14,padding:"1.25rem",maxWidth:"92vw",display:"flex",flexDirection:"column",gap:"1rem"}}>
        <div style={{display:"flex",alignItems:"center",justifyContent:"space-between"}}>
          <strong style={{color:"#042C53",fontSize:"1rem"}}>Crop Photo</strong>
          <button onClick={onCancel} style={{background:"none",border:"none",fontSize:"1.4rem",cursor:"pointer",color:"#9ca3af",lineHeight:1,padding:"0 4px"}}>x</button>
        </div>
        <div style={{display:"flex",gap:6,flexWrap:"wrap",alignItems:"center"}}>
          {Object.keys(asps).map(k=>(

function UploadProvider({children}){
  const SECRET='eegrid2026';
  const[editMode,setEditMode]=useState(false);
  const[keyBuf,setKeyBuf]=useState('');

  useEffect(()=>{
    const handler=e=>{
      setKeyBuf(b=>{
        const next=(b+e.key).slice(-SECRET.length);
        if(next===SECRET){setEditMode(m=>{
          if(!m)alert('Edit mode ON. Click any photo to replace.');
          else alert('Edit mode OFF.');
          return !m;
        });return '';}
        return next;
      });
    };
    window.addEventListener('keydown',handler);
    return()=>window.removeEventListener('keydown',handler);
  },[]);

  const[imgs,setImgs]=useState({});
  const[modal,setModal]=useState(null);
  const[syncing,setSyncing]=useState(false);
  const fileRef=useRef(null);
  const pending=useRef({});
  const sb=window._SUPA;
  const BUCKET='eegrid-photos';

  useEffect(()=>{
    (async()=>{
      try{
        const{data,error}=await sb.storage.from(BUCKET).list('photos',{limit:100});
        if(error||!data)return;
        const loaded={};
        for(const f of data){
          const id=f.name.replace(/\.[^.]+$/,'');
          const{data:d}=sb.storage.from(BUCKET).getPublicUrl('photos/'+f.name);
          loaded[id]=d.publicUrl+'?v='+Date.now();
        }
        if(Object.keys(loaded).length)setImgs(loaded);
      }catch(e){console.warn('Load error:',e);}
    })();
  },[]);

  const open=(id,aspect)=>{
    pending.current={id,aspect};
    fileRef.current.click();
  };

  const onFile=e=>{
    const file=e.target.files[0];
    if(!file)return;
    e.target.value='';
    const isGif=file.type==='image/gif';
    const reader=new FileReader();
    reader.onload=ev=>{
      if(isGif){
        // Skip crop for GIFs — use as-is
        const b64=ev.target.result;
        const id=pending.current.id;
        setImgs(p=>({...p,[id]:b64}));
        setSyncing(true);
        fetch(b64).then(r=>r.blob()).then(blob=>{
          const path='photos/'+id+'.gif';
          return sb.storage.from(BUCKET).upload(path,blob,{upsert:true,contentType:'image/gif'});
        }).then(({error,data})=>{
          if(error)throw error;
          const{data:d}=sb.storage.from(BUCKET).getPublicUrl('photos/'+id+'.gif');
          setImgs(p=>({...p,[id]:d.publicUrl+'?v='+Date.now()}));
        }).catch(e=>console.warn('GIF upload failed:',e)).finally(()=>setSyncing(false));
      } else {
        setModal({id:pending.current.id,src:ev.target.result,aspect:pending.current.aspect});
      }
    };
    reader.readAsDataURL(file);
  };

  const onConfirm=async(b64)=>{
    const id=modal.id;
    const isGif=modal.src&&modal.src.startsWith('data:image/gif');
    // For GIFs use the original src (skip crop canvas which kills animation)
    const finalB64=isGif?modal.src:b64;
    setModal(null);
    setImgs(p=>({...p,[id]:finalB64}));
    setSyncing(true);
    try{
      const res=await fetch(finalB64);
      const blob=await res.blob();
      const ext=isGif?'gif':'jpg';
      const mime=isGif?'image/gif':'image/jpeg';
      const path='photos/'+id+'.'+ext;
      const{error}=await sb.storage.from(BUCKET).upload(path,blob,{upsert:true,contentType:mime});
      if(error)throw error;
      const{data}=sb.storage.from(BUCKET).getPublicUrl(path);
      setImgs(p=>({...p,[id]:data.publicUrl+'?v='+Date.now()}));
    }catch(e){
      console.warn('Upload failed:',e);
      alert('Sync failed: '+e.message+'\n\nCheck bucket is public and has INSERT policy for anon role.');
    }finally{setSyncing(false);}
  };

  return(
    <UploadCtx.Provider value={{imgs,open,syncing,editMode}}>
      <input ref={fileRef} type="file" accept="image/*,image/gif" style={{display:"none"}} onChange={onFile}/>
      {editMode&&<div style={{position:"fixed",bottom:20,left:20,background:"#042C53",color:"#B5D4F4",padding:"7px 16px",borderRadius:20,fontSize:".78rem",fontWeight:500,zIndex:9997,boxShadow:"0 2px 12px rgba(0,0,0,.4)"}}>Edit mode ON</div>}
      {syncing&&<div style={{position:"fixed",bottom:20,right:20,background:"#042C53",color:"#fff",padding:"8px 16px",borderRadius:8,fontSize:".8rem",zIndex:9998}}>Saving photo...</div>}
      {modal&&<CropModal src={modal.src} aspect={modal.aspect} onConfirm={onConfirm} onCancel={()=>setModal(null)}/>}
      {children}
    </UploadCtx.Provider>
  );
}

function ProblemPage(){
  return(
    <>
      <PH2 title="Problem Statement" sub="Understanding the clinical need that EEGrid was designed to address"/>

        <SH label="Background & Motivation" title="Why Does This Matter?"/>
        <p style={{color:"#6b7280",fontSize:".975rem",lineHeight:1.75,marginBottom:".8rem"}}>Electroencephalography (EEG) measures brain electrical activity non-invasively by placing electrodes on the scalp, capturing event-related potentials (ERPs) that are critical for assessing cognitive function, diagnosing neurological conditions, and enabling brain-computer interface (BCI) research. Despite its clinical importance, EEG adoption remains limited by a fundamental trade-off between two electrode paradigms.</p>
        <p style={{color:"#6b7280",fontSize:".975rem",lineHeight:1.75,marginBottom:".8rem"}}>Wet gel electrodes (Ag/AgCl) deliver superior signal quality but require up to 45 minutes of setup, messy conductive gels, and post-session hair cleaning. Dry electrodes offer fast, gel-free setup but suffer from high input impedance (>1 MΩ) and noise artifacts from sweat and motion. Neither system is well-suited to the 10,000–100,000 potential users in academic, educational, and hobbyist settings who require both fidelity and practicality.</p>
        <p style={{color:"#6b7280",fontSize:".975rem",lineHeight:1.75,margin:0}}>Current commercial high-fidelity EEG systems -- such as the CGX Quick-20 and Biosemi Active Two -- cost $10,000–$30,000 and come in fixed head sizes, requiring labs to purchase multiple headsets to accommodate different subjects. This financial barrier effectively excludes student research groups, independent researchers, and educators from accessing high-density EEG technology.</p>
        <G3>
          <KCard icon="chart-bar" title="Scale of the Problem" text="Commercial EEG systems cost $10,000–$30,000. The estimated addressable market of independent researchers, student labs, hobbyists, and educators is between 10,000 and 100,000 potential users currently priced out of the technology."/>
          <KCard icon="alert-triangle" title="Limitations of Current Solutions" text="Wet EEG requires 30–45 minutes of setup and conductive gel. Dry EEG has high impedance (>1 MΩ) and noise artifacts. Both use fixed-size caps that cannot be reconfigured for different head sizes or electrode paradigms."/>
          <KCard icon="building" title="Clinical Setting" text="EEGrid targets research labs, university classrooms, and maker/hobbyist environments. It is designed for short-to-medium duration EEG studies (30–60 minutes) requiring event-related potential (ERP) recordings such as P300, VEP, and alpha-suppression paradigms."/>
        </G3>
      </SEC>
      <HR/>
      <SEC>
        <SH label="Formal Problem Statement" title="The Challenge We're Solving"/>
        <blockquote style={{background:C.bx,borderLeft:`4px solid ${C.ba}`,borderRadius:"0 8px 8px 0",padding:"1.1rem 1.4rem",fontStyle:"italic",color:C.bm,fontSize:".9rem",marginBottom:"1.1rem",marginLeft:0,marginRight:0}}>
          "Current EEG systems present an unresolved trade-off between signal quality and usability, compounded by costs exceeding $10,000 and fixed electrode configurations that limit accessibility. There is a need for a low-cost, modular EEG headset with semi-dry electrodes that achieves clinical-grade impedance (≤30 kΩ), adapts to different head sizes and paradigms, and can be reproduced for under $400."
        </blockquote>
        <p style={{color:"#6b7280",fontSize:".975rem",lineHeight:1.75,margin:0}}>The core engineering challenge is achieving low input impedance without the mess and setup burden of traditional wet systems. A viable solution must maintain stable scalp contact through hair, sustain low impedance over a full recording session (~30–60 minutes), fit a range of head sizes without requiring multiple fixed caps, and be manufacturable at a cost accessible to non-clinical users. EEGrid addresses all four requirements simultaneously through a hybrid hydrogel-comb electrode design and a fully modular 3D-printed mechanical architecture.</p>
      </SEC>
      <HR/>
      <SEC>
        <SH label="Engineering Requirements" title="Design Constraints & Specifications"/>
        <p style={{color:"#6b7280",fontSize:".975rem",lineHeight:1.75}}>EEGrid was designed to satisfy four primary engineering requirements: (1) effective contact impedance (ECI) of 30 kΩ or below to meet IEC 60601-2-26 clinical EEG standards [4]; (2) total system cost under $400, targeting at least a 95% reduction relative to commercial alternatives costing $10,000--$30,000 [3]; (3) setup time under 15 minutes with no abrasive scalp preparation or conductive gel required [1,4]; and (4) biocompatibility per ISO 10993-1 and electrical safety per IEC 60601-1 for all patient-contact components [2].</p>
        <IL items={['Effective contact impedance (ECI) ≤ 30 kΩ at the skin-electrode interface (per IEC 60601-2-26)','Total system manufacturing cost ≤ $400 (hydrogel electrodes ≤ $15 for an 8-pack)','Headset setup time ≤ 15 minutes; adjustable to fit head circumferences of 52–60 cm and nasion–inion distances of 33–39 cm','All components must be biocompatible (ISO 10993-1) and electrically safe (IEC 60601-1)']}/>
      </SEC>
      <HR/>
      <SEC>
        <SH label="Broader Implications" title="Global Impact & Ethics"/>
        <G2>
          <p style={{color:"#6b7280",fontSize:".975rem",lineHeight:1.75,margin:0}}>EEGrid's open-source, low-cost design has the potential to democratize EEG technology far beyond university research labs. By eliminating the $10,000+ cost barrier and removing the need for conductive gel or professional technician setup, EEGrid can enable neurological screening in rural US clinics, community health centers, and low-resource international settings where EEG has historically been inaccessible. In the longer term, validated open-source neurotechnology can support global neuroscience education, reduce disparities in epilepsy diagnosis, and serve as a platform for citizen-science BCI research.</p>
          <p style={{color:"#6b7280",fontSize:".975rem",lineHeight:1.75,margin:0}}>Neural data raises important privacy concerns: brain activity can reveal cognitive states, health conditions, and behavioral patterns. EEGrid's team has documented risks around data ownership, informed consent, and potential misuse for behavioral profiling or surveillance. All hydrogel materials must pass biocompatibility testing (ISO 10993-1) before use on human subjects. The open-source nature of the design also raises IP considerations around responsible sharing.</p>
        </G2>
      </SEC>
      <PageCredit name="Megan Liem"/>
    </>
  );
}

      </div>
      {tab==="overview"&&(
        <SEC>
          <SH label="Solution Overview" title="How EEGrid Works"/>
          <G2>
            <div>
              <p style={{color:"#6b7280",fontSize:".975rem",lineHeight:1.75,marginBottom:".8rem"}}>EEGrid is a modular EEG headset with a novel semi-dry hydrogel electrode that combines the hair-parsing convenience of dry systems with the low impedance of wet systems [1,4]. The device consists of two integrated subprojects: a hydrogel-based electrode assembly and a fully modular, 3D-printed mechanical headset.</p>
              <p style={{color:"#6b7280",fontSize:".975rem",lineHeight:1.75,marginBottom:".8rem"}}>The electrode uses a three-pronged comb morphology made entirely of conductive hydrogel (PEDOT:PSS + PVA + GA + DMSO + HCl) [2,5], housed in a compliant rotary actuator assembly that maintains consistent scalp contact across different hair densities. An active electrode PCB with unity-gain instrumentation amplification conditions the signal locally at each electrode site before streaming to a central 8-channel breakout board via FFC connectors and LSL.</p>
              <p style={{color:"#6b7280",fontSize:".975rem",lineHeight:1.75,margin:0}}>Unlike existing semi-dry electrodes that use rigid substrates with hydrogel tips [2,5], EEGrid's electrode is constructed entirely from hydrogel -- eliminating the substrate-hydrogel interface and enabling the comb prongs themselves to be conductive. At under $250 total system cost, EEGrid achieves a >95% cost reduction relative to comparable commercial systems [3].</p>

            <KCard icon="flask-conical" title="Hydrogel Electrode" text="A novel PEDOT:PSS-based semi-dry hydrogel with a three-pronged comb morphology that parses through hair for stable scalp contact, achieving 30 kΩ impedance without abrasive prep or conductive gel."/>

          <SH label="Technical Details" title="Design & Engineering"/>
          <p style={{color:"#6b7280",fontSize:".975rem",lineHeight:1.75}}>EEGrid integrates material science (PEDOT:PSS hydrogel electrode synthesis and characterization), electrical engineering (active electrode PCB design and EEG signal acquisition), and mechanical engineering (3D-printed modular headset frame with multi-DOF electrode housing).</p>

          <h3 style={{fontWeight:700,fontSize:"1.5rem",color:"#042C53",marginTop:"2rem",marginBottom:"1rem",letterSpacing:"-.02em"}}>Hydrogel Electrode</h3>
          <p style={{color:"#6b7280",fontSize:".975rem",lineHeight:1.75,marginBottom:"1.5rem"}}>The hardware system integrates three subsystems: the hydrogel electrode assembly, the active electrode PCB, and the modular headset frame. Each electrode site hosts a dedicated PCB performing local signal conditioning before data is routed to a central 8-channel breakout board. The headset frame is fabricated entirely from 3D-printed PLA (rigid holders) and TPU (flexible straps), with no metal fasteners required.</p>

function TeamPage({go}){
  const mob=useIsMob();
  const ctx=React.useContext(UploadCtx);
  return(
    <>
      <PH2 title="Meet the Team" sub="Five UCSD Bioengineers -- one mission"/>
      <SEC>
        <SH label="Who We Are" title="The People Behind EEGrid"/>
        <p style={{color:"#6b7280",fontSize:".975rem",lineHeight:1.75,marginBottom:".7rem"}}>We are five Bioengineering seniors from UC San Diego's Jacobs School of Engineering, affiliated with the Swartz Center for Computational Neuroscience (SCCN). Our shared interest in neurotechnology and accessible medical devices brought us together for BENG 187 Senior Design.</p>
        <p style={{color:"#6b7280",fontSize:".975rem",lineHeight:1.75,margin:0}}>We are advised by Dr. Gert Cauwenberghs and Dr. Tzyy-Ping Jung, with mentorship from PhD student Yuhong Zhang, MS. Our project is supported by the NanoBioElectronics Lab and the Design and Innovation Makerspace (DIB) at UC San Diego.</p>
        <div style={{display:"grid",gridTemplateColumns:mob?"repeat(2,1fr)":"repeat(5,1fr)",gap:"1rem",marginTop:"1.75rem"}}>
          {MEMBERS.map(m=>(
            <div key={m.id} className="tc" style={{background:"#fff",border:".5px solid #e5e7eb",borderRadius:12,padding:mob?"1.25rem .85rem":"1.4rem 1rem",textAlign:"center"}} onClick={()=>go(`member-${m.id}`)}>
              {(()=>{const tp=ctx&&ctx.imgs&&ctx.imgs[`team-${m.id}`];return tp?<img src={tp} onClick={e=>{e.stopPropagation();ctx&&ctx.editMode&&ctx.open(`team-${m.id}`,"1:1");}} style={{width:mob?50:56,height:mob?50:56,borderRadius:"50%",objectFit:"cover",margin:"0 auto .7rem",display:"block",border:"2px solid rgba(55,138,221,.3)",cursor:"pointer"}}/>:<div style={{width:mob?50:56,height:mob?50:56,borderRadius:"50%",background:m.bg,margin:"0 auto .7rem",display:"flex",alignItems:"center",justifyContent:"center",fontWeight:500,fontSize:mob?".9rem":"1rem",color:"#fff",cursor:"pointer"}} onClick={e=>{e.stopPropagation();ctx&&ctx.editMode&&ctx.open(`team-${m.id}`,"1:1");}} title={ctx&&ctx.editMode?"Click to upload photo":""}>{m.init}</div>;})()}
              <h3 style={{fontWeight:500,fontSize:mob?".78rem":".82rem",color:"#111",marginBottom:".15rem",marginTop:0}}>{m.name}</h3>
              
              <span style={{color:C.ba,fontSize:".7rem",fontWeight:500,display:"inline-flex",alignItems:"center",gap:2}}>View <Icon name="arrow-right" size={9} color={C.ba}/></span>
            </div>
          ))}
        </div>
      </SEC>
      
      <PageCredit name="Megan Liem"/>
    </>
  );
}
const MEMBERS_DATA={
  1:{bio:"Jose is passionate about electronics and hardware, particularly at their intersection with physiological signals and biosystems. His work on EEGrid centered on the electrode itself -- synthesizing the PEDOT:PSS hydrogel formulation and building the PCB that powers each electrode site.",exp:["Undergraduate Researcher, NanoBioElectronics Lab (Dr. Joseph Wang), UC San Diego"],contribs:[{icon:"flask-conical",title:"Hydrogel Synthesis",text:"Designed and fabricated the PEDOT:PSS hydrogel electrode, optimizing the formulation for low impedance and mechanical stability."},{icon:"chip",title:"PCB Design",text:"Led the design and manufacturing of the active electrode PCB, including schematic capture, layout, DRC verification, and component sourcing."},{icon:"activity",title:"Electronics Validation",text:"Conducted systematic testing of the full electronics system, identifying a transient response issue in the main amplifier and filtering stage."}],reflections:["Gained hands-on experience with the full PCB design workflow, including DRC verification, layer stack-up planning, component ordering, and ensuring the board was free of short circuits.","Developed a deep understanding of hydrogel composition -- specifically how the polymer backbone provides structural integrity and how cross-linking influences the network conductivity."],photo:"data:image/jpeg;base64,/9j/4AAQSkZJRgABAQAAAQABAAD/2wBDAAcFBQYFBAcGBgYIBwcICxILCwoKCxYPEA0SGhYbGhkWGRgcICgiHB4mHhgZIzAkJiorLS4tGyIyNTEsNSgsLSz/2wBDAQcICAsJCxULCxUsHRkdLCwsLCwsLCwsLCwsLCwsLCwsLCwsLCwsLCwsLCwsLCwsLCwsLCwsLCwsLCwsLCwsLCz/wAARCAFeARgDASIAAhEBAxEB/8QAHwAAAQUBAQEBAQEAAAAAAAAAAAECAwQFBgcICQoL/8QAtRAAAgEDAwIEAwUFBAQAAAF9AQIDAAQRBRIhMUEGE1FhByJxFDKBkaEII0KxwRVS0fAkM2JyggkKFhcYGRolJicoKSo0NTY3ODk6Q0RFRkdISUpTVFVWV1hZWmNkZWZnaGlqc3R1dnd4eXqDhIWGh4iJipKTlJWWl5iZmqKjpKWmp6ipqrKztLW2t7i5usLDxMXGx8jJytLT1NXW19jZ2uHi4+Tl5ufo6erx8vP09fb3+Pn6/8QAHwEAAwEBAQEBAQEBAQAAAAAAAAECAwQFBgcICQoL/8QAtREAAgECBAQDBAcFBAQAAQJ3AAECAxEEBSExBhJBUQdhcR   2:{bio:"Rohan is a Bioengineering student at UC San Diego with an interest in neuroengineering and surgical robotics. He served as Team Lead for EEGrid, coordinating between subsystems while contributing directly to the mechanical design of the electrode housing.",exp:["Neurosciences Researcher, Graves Neuroimmunology Research Group","Certified for clinical trial use of Advanced Brain Monitoring StatX24 EEG","Trained for clinical trial use of the Wearable Sensing DSI VR-300 and DSI VR-VEP"],contribs:[{icon:"settings",title:"Electrode Housing Design",text:"Designed the 4-DOF quasi-spherical electrode housing in CAD, incorporating yaw rotation, axial compression via TPU spring, and pitch/roll compliance for consistent scalp contact."},{icon:"puzzle",title:"Hydrogel Mold Design",text:"Collaboratively designed the hydrogel electrode mold in CAD, ensuring the three-pronged comb geometry translated accurately from concept to fabrication."},{icon:"star",title:"Team Coordination",text:"Bridged the mechanical and materials subsystems, keeping design iterations aligned with team goals, advisor feedback, and the DEBUT competition timeline."}],reflections:["Bridged the mechanical components of the modular headset and the hydrogel electrode, designing the electrode housing in CAD and collaboratively designing the hydrogel mold based on teammates feedback.","Gained practical experience translating research-grade neurotechnology concepts into manufacturable, reproducible hardware designs."],photo:"data:image/jpeg;base64,/9j/4AAQSkZJRgABAQAAAQABAAD/2wBDAAQDAwMDAgQDAwMEBAQFBgoGBgUFBgwICQcKDgwPDg4MDQ0PERYTDxAVEQ0NExoTFRcYGRkZDxIbHRsYHRYYGRj/2wBDAQQEBAYFBgsGBgsYEA0QGBgYGBgYGBgYGBgYGBgYGBgYGBgYGBgYGBgYGBgYGBgYGBgYGBgYGBgYGBgYGBgYGBj/wAARCAFAARgDASIAAhEBAxEB/8QAHwAAAQUBAQEBAQEAAAAAAAAAAAECAwQFBgcICQoL/8QAtRAAAgEDAwIEAwUFBAQAAAF9AQIDAAQRBRIhMUEGE1FhByJxFDKBkaEII0KxwRVS0fAkM2JyggkKFhcYGRolJicoKSo0NTY3ODk6Q0RFRkdISUpTVFVWV1hZWmNkZWZnaGlqc3R1dnd4eXqDhIWGh4iJipKTlJWWl5iZmqKjpKWmp6ipqrKztLW   3:{bio:"Megan is a Bioengineering student at UC San Diego with interests in neuroengineering, brain-computer interfaces, and the systems integration side of medical device development. Her work on EEGrid focused on signal validation, documentation, and systems-level oversight.",exp:["Neuroengineering Validation Intern, Wearable Sensing","BENG 199 Research Rotation, Swartz Center for Computational Neuroscience (SCCN)"],contribs:[{icon:"wave-sine",title:"EEG Signal Validation",text:"Conducted EEG signal validation experiments, running Welch PSD analysis and artifact rejection pipelines in MATLAB/EEGLAB to establish baseline performance benchmarks."},{icon:"file-text",title:"Documentation & Regulatory",text:"Led technical report writing covering ISO 10993-1, ISO 14971, IEC 60601-1, and FMEA, and coordinated the DEBUT competition video script and submission materials."},{icon:"layout-grid",title:"Systems Integration",text:"Oversaw systems-level integration across subsystems, ensuring design traceability between the hydrogel electrode, PCB, and headset frame."}],reflections:["This project deepened my understanding of how hardware, materials, and software constraints interact at the system level in a real medical device.","I gained hands-on experience translating regulatory frameworks (IEC 60601, ISO 10993) into practical design decisions and documenting iterative prototype development."],photo:"data:image/jpeg;base64,/9j/4AAQSkZJRgABAQAAAQABAAD/2wBDAAcFBQYFBAcGBgYIBwcICxILCwoKCxYPEA0SGhYbGhkWGRgcICgiHB4mHhgZIzAkJiorLS4tGyIyNTEsNSgsLSz/2wBDAQcICAsJCxULCxUsHRkdLCwsLCwsLCwsLCwsLCwsLCwsLCwsLCwsLCwsLCwsLCwsLCwsLCwsLCwsLCwsLCwsLCz/wAARCAFeARgDASIAAhEBAxEB/8QAHwAAAQUBAQEBAQEAAAAAAAAAAAECAwQFBgcICQoL/8QAtRAAAgEDAwIEAwUFBAQAAAF9AQIDAAQRBRIhMUEGE1FhByJxFDKBkaEII0KxwRVS0fAkM2JyggkKFhcYGRolJicoKSo0NTY3ODk6Q0RFRkdISUpTVFVWV1hZWmNkZWZnaGlqc3R1dnd4eXqDhIWGh4iJipKTlJWWl5iZmqKjpKWmp6ipqrKztLW2t7i5usLDxMXGx8jJytLT1NXW19jZ2uHi4+Tl5ufo6erx8vP09fb3+Pn6/8QAHwEAAwEBAQEBAQEBAQAAAAAAAAECAwQFBg   4:{bio:"TJ is a Bioengineering:Biosystems student at UC San Diego with a focused interest in neural interfaces, assistive technology, and neurotechnology. Core technical areas include physiological signal acquisition and processing (EEG, EMG), analog circuit design, and PCB development.",exp:[],contribs:[{icon:"cpu",title:"Signal Acquisition Hardware",text:"Developed and validated the signal acquisition hardware, including PCB design and testing, to ensure accurate and reliable biosensor data collection."},{icon:"activity",title:"Fit Testing",text:"Fitted participants with the EEGrid headset during human subject testing sessions, evaluating comfort, electrode contact, and signal quality."},{icon:"bolt",title:"Industry Collaboration",text:"Engaged with professionals at CGX and Wearable Sensing for feedback on electronic design considerations and refined the acquisition system accordingly."}],reflections:["This project provided me with invaluable hands-on experience fitting participants with wearable neurotechnology. I met with industry professionals at CGX and Wearable Sensing to understand key electronic design considerations.","Their industry perspectives paired with mentorship from Professor Gert Cauwenberghs provided the support to successfully develop the electronics system alongside my colleague Jose."],photo:"data:image/jpeg;base64,/9j/4AAQSkZJRgABAQAAAQABAAD/2wBDAAcFBQYFBAcGBgYIBwcICxILCwoKCxYPEA0SGhYbGhkWGRgcICgiHB4mHhgZIzAkJiorLS4tGyIyNTEsNSgsLSz/2wBDAQcICAsJCxULCxUsHRkdLCwsLCwsLCwsLCwsLCwsLCwsLCwsLCwsLCwsLCwsLCwsLCwsLCwsLCwsLCwsLCwsLCz/wAARCAFeARgDASIAAhEBAxEB/8QAHwAAAQUBAQEBAQEAAAAAAAAAAAECAwQFBgcICQoL/8QAtRAAAgEDAwIEAwUFBAQAAAF9AQIDAAQRBRIhMUEGE1FhByJxFDKBkaEII0KxwRVS0fAkM2JyggkKFhcYGRolJicoKSo0NTY3ODk6Q0RFRkdISUpTVFVWV1hZWmNkZWZnaGlqc3R1dnd4eXqDhIWGh4iJipKTlJWWl5iZmqKjpKWmp6ipqrKztLW2t7i5usLDxMXGx8jJytLT1NXW19jZ2uHi4+Tl5ufo6erx8vP09fb3+Pn6/8QAHwEAAwEBAQEBAQEBAQAAAAAAAAECAwQFBgcICQoL/8QAtREAAgECBAQDBAcFBAQAAQJ3AAECAxEEBSExBhJBUQdhcRMiMoEIFEKRobHBCSMzUv   5:{bio:"Cheryl is a Bioengineering student at UC San Diego with an interest in the mental health applications of neurotechnology -- including how EEG can be used to better understand brain activity and support future approaches to mental health monitoring and treatment.",exp:["Undergraduate Researcher, Functional Neuroscience Lab (UCSD Department of Psychiatry)","Undergraduate Clinical Research Intern, Cognitive Assessment and Risk Evaluation Program (UCSD Department of Psychiatry)"],contribs:[{icon:"settings",title:"Headset Prototyping",text:"Prototyped and fabricated the adjustable headset components for the modular EEG system, iterating on PLA and TPU designs through multiple print cycles."},{icon:"adjustments",title:"CAD & 3D Printing",text:"Gained hands-on experience with CAD modeling and 3D printing with diverse materials including TPU for flexible straps and PLA for rigid electrode holders."},{icon:"puzzle",title:"Project Management",text:"Managed project timelines, team deliverables, and meeting coordination throughout the BENG 187 year, keeping the project on track across all subsystems."}],reflections:["Gained practical experience with CAD modeling, 3D printing with different materials such as TPU, and iterative prototype development.","Developed a deeper appreciation for how mechanical design constraints interact with the clinical performance requirements of a wearable EEG system."],photo:"data:image/jpeg;base64,/9j/4AAQSkZJRgABAQAAAQABAAD/2wBDAAcFBQYFBAcGBgYIBwcICxILCwoKCxYPEA0SGhYbGhkWGRgcICgiHB4mHhgZIzAkJiorLS4tGyIyNTEsNSgsLSz/2wBDAQcICAsJCxULCxUsHRkdLCwsLCwsLCwsLCwsLCwsLCwsLCwsLCwsLCwsLCwsLCwsLCwsLCwsLCwsLCwsLCwsLCz/wAARCAFeARgDASIAAhEBAxEB/8QAHwAAAQUBAQEBAQEAAAAAAAAAAAECAwQFBgcICQoL/8QAtRAAAgEDAwIEAwUFBAQAAAF9AQIDAAQRBRIhMUEGE1FhByJxFDKBkaEII0KxwRVS0fAkM2JyggkKFhcYGRolJicoKSo0NTY3ODk6Q0RFRkdISUpTVFVWV1hZWmNkZWZnaGlqc3R1dnd4eXqDhIWGh4iJipKTlJWWl5iZmqKjpKWmp6ipqrKztLW2t7i5usLDxMXGx8jJytLT1NXW19jZ2uHi4+Tl5ufo6erx8vP09fb3+Pn6/8QAHwEAAwEBAQEBAQEBAQAAAAA function MemberPage({id,go}){
  const mob=useIsMob();
  const ctx=React.useContext(UploadCtx);
  const m=MEMBERS.find(x=>x.id===id)||MEMBERS[0];
  const d=MEMBERS_DATA[id]||{};
  return(
    <>
      <div style={{background:C.bd,padding:mob?"2rem 1.25rem":"2.75rem 1.75rem"}}>
        <div style={{maxWidth:1020,margin:"0 auto",display:"flex",flexDirection:mob?"column":"row",alignItems:mob?"flex-start":"center",gap:mob?"1rem":"1.75rem"}}>
          {(()=>{const tp=ctx&&ctx.imgs&&ctx.imgs[`team-${m.id}`];const src=tp||d.photo;return src?<img src={src} alt={m.name} style={{width:mob?72:90,height:mob?72:90,borderRadius:"50%",objectFit:"cover",flexShrink:0,border:"2px solid rgba(55,138,221,.4)",cursor:"pointer"}} onClick={()=>ctx&&ctx.editMode&&ctx.open(`team-${m.id}`,"1:1")} title={ctx&&ctx.editMode?"Click to change photo":""}/>:<div style={{width:mob?72:90,height:mob?72:90,borderRadius:"50%",background:m.bg,flexShrink:0,display:"flex",alignItems:"center",justifyContent:"center",fontWeight:500,fontSize:mob?"1.3rem":"1.6rem",color:"#fff",cursor:"pointer"}} onClick={()=>ctx&&ctx.editMode&&ctx.open(`team-${m.id}`,"1:1")} title={ctx&&ctx.editMode?"Upload photo":""}>{m.init}</div>;})()}
          <div>
            <h1 style={{fontSize:mob?"1.35rem":"clamp(1.35rem,3.5vw,1.85rem)",fontWeight:500,color:"#fff",letterSpacing:"-.03em",marginBottom:".25rem",marginTop:0}}>{m.name}</h1>
            <p style={{color:C.ba,fontSize:".975rem",fontWeight:500,margin:0}}>{m.role}</p>
            <p style={{color:"rgba(255,255,255,.38)",fontSize:".78rem",marginTop:".15rem",marginBottom:0}}>{"B.S. Bioengineering, UC San Diego · Class of 2026"}</p>
          </div>
        </div>
      </div>
      <SEC>
        <SH label="About Me" title="Background & Interests"/>
        <G2>
          <div>
            <p style={{color:"#6b7280",fontSize:".975rem",lineHeight:1.75,marginBottom:"1rem"}}>{d.bio||""}</p>
            {d.exp&&d.exp.length>0&&(<div style={{background:C.bx,borderRadius:12,padding:"1rem 1.2rem"}}>
              <p style={{fontSize:".63rem",fontWeight:500,letterSpacing:".15em",textTransform:"uppercase",color:C.ba,marginBottom:".5rem",marginTop:0}}>Relevant Experience</p>
              <IL items={d.exp}/>
            </div>)}
          </div>
          {(()=>{
            const tp=ctx&&ctx.imgs&&ctx.imgs[`team-${m.id}`];
            const src=tp||d.photo;
            return src
              ?<div style={{position:"relative",justifySelf:"center",cursor:"pointer"}} onClick={()=>ctx&&ctx.editMode&&ctx.open(`team-${m.id}`,"3:4")} title={ctx&&ctx.editMode?"Click to replace photo":""}>
                <img src={src} alt={m.name} style={{width:"100%",maxWidth:320,borderRadius:14,objectFit:"cover",aspectRatio:"3/4",display:"block",border:".5px solid #e5e7eb"}}/>
                <div style={{position:"absolute",inset:0,borderRadius:14,display:"flex",alignItems:"center",justifyContent:"center",opacity:0,transition:"opacity .2s"}}
                  onMouseEnter={e=>{e.currentTarget.style.opacity=1;e.currentTarget.style.background="rgba(0,0,0,.35)";}}
                  onMouseLeave={e=>{e.currentTarget.style.opacity=0;e.currentTarget.style.background="transparent";}}>
                  <span style={{color:"#fff",fontSize:".8rem",fontWeight:500,background:"rgba(0,0,0,.5)",padding:"6px 14px",borderRadius:20}}>Replace photo</span>
                </div>
              </div>
              :<div onClick={()=>ctx&&ctx.editMode&&ctx.open(`team-${m.id}`,"3:4")} style={{justifySelf:"center",width:"100%",maxWidth:320,aspectRatio:"3/4",background:C.bx,border:"1.5px dashed rgba(55,138,221,.4)",borderRadius:14,display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center",gap:8,cursor:"pointer",minHeight:260}}
                onMouseEnter={e=>{e.currentTarget.style.borderColor="rgba(55,138,221,.75)";e.currentTarget.style.background="#daeaf7";}}
                onMouseLeave={e=>{e.currentTarget.style.borderColor="rgba(55,138,221,.4)";e.currentTarget.style.background=C.bx;}}>
                <Icon name="camera" size={22} color={C.ba} style={{opacity:.6}}/>
                <span style={{color:C.bb,fontSize:".85rem",fontWeight:500}}>Upload Photo</span>
                <span style={{color:C.ba,fontSize:".72rem",opacity:.8}}>Click to upload</span>
              </div>;
          })()}
        </G2>
      </SEC>
      <HR/>
      <SEC>
        <SH label="Reflection" title="What I Learned"/>
        <IL items={d.reflections||[]}/>
      </SEC>
      <HR/>
      <section style={{padding:"1.25rem 1.25rem 2.25rem",maxWidth:1020,margin:"0 auto"}}>
        <button className="bbtn" style={{color:C.bb,fontSize:".85rem",fontWeight:500,display:"inline-flex",alignItems:"center",gap:5}} onClick={()=>{go("team");window.scrollTo(0,0);}}>
          <Icon name="arrow-left" size={13} color={C.bb}/> Back to Team
        </button>
      </section>
      <PageCredit name={m.name}/>
    </>
  );
}

        </div>
      </SEC>
      <PageCredit name="Rohan Kumar"/>
    </>
  );

  const[page,setPage]=useState("home");
  const[solutionTab,setSolutionTab]=useState("overview");
  const[history,setHistory]=useState([]);
  const go=p=>{setHistory(h=>[...h,page]);setPage(p);window.scrollTo({top:0,behavior:"smooth"});};
  const goTab=(p,tab)=>{setHistory(h=>[...h,page]);setSolutionTab(tab);setPage(p);window.scrollTo({top:0,behavior:"smooth"});};
  const goBack=()=>{if(history.length===0)return;const prev=history[history.length-1];setHistory(h=>h.slice(0,-1));setPage(prev);window.scrollTo({top:0,behavior:"smooth"});};
  const mid=page.startsWith("member-")?parseInt(page.split("-")[1]):null;
  return(
    <UploadProvider><div style={{minHeight:"100vh",display:"flex",flexDirection:"column",background:"#f9fafb",fontFamily:"system-ui,-apple-system,sans-serif",fontSize:"16px"}}>
      <Nav page={page} go={go} goTab={goTab} goBack={goBack} canGoBack={history.length>0}/>
      <main style={{flex:1}}>
        {page==="home"&&<HomePage go={go}/>}
        {page==="problem"&&<ProblemPage/>}
        {page==="solution"&&<SolutionPage defaultTab={solutionTab}/>}
        {page==="team"&&<TeamPage go={go}/>}
        {mid!==null&&<MemberPage id={mid} go={go}/>}
        {page==="ack"&&<AckPage/>}
      </main>
      <Footer go={go}/>
    </div></UploadProvider>
  );
}

ReactDOM.render(<App/>,document.getElementById("root"));
</script>
</body>
</html>
