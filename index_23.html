  <style>
    *{box-sizing:border-box;}
    body{margin:0;font-family:system-ui,-apple-system,sans-serif;background:#f9fafb;}
    .nl{background:none;border:none;border-bottom:2px solid transparent;color:rgba(255,255,255,.65);font-size:.83rem;font-weight:500;letter-spacing:.02em;padding:4px 0;cursor:pointer;transition:color .15s,border-color .15s;font-family:inherit;white-space:nowrap;}
    .nl:hover,.nl.on{color:#B5D4F4;border-bottom-color:#378ADD;}
    .qnc{transition:border-color .15s,transform .15s;cursor:pointer;}
    .qnc:hover{border-color:#378ADD!important;transform:translateY(-2px);}
    .kc{transition:transform .2s,border-color .2s;}
    .kc:hover{transform:translateY(-3px);border-color:#378ADD!important;}
    .tc{transition:transform .2s,border-color .2s;cursor:pointer;}
    .tc:hover{transform:translateY(-4px);border-color:#378ADD!important;}
    .stab{background:none;border:none;border-bottom:2px solid transparent;cursor:pointer;font-family:inherit;transition:color .15s,border-color .15s;border-radius:0;}
    .stab:hover,.stab.on{color:#185FA5!important;border-bottom-color:#185FA5;}
    .cbtn{transition:background .15s;cursor:pointer;}
    .cbtn:hover{background:rgba(255,255,255,.28)!important;}.cbtn.dark:hover{background:rgba(4,44,83,.2)!important;}
    .dot{cursor:pointer;transition:background .2s,transform .2s;width:7px;height:7px;border-radius:50%;background:rgba(255,255,255,.35);display:inline-block;}
    .dot.on{background:#378ADD!important;transform:scale(1.3);}
    .pbtn{cursor:pointer;transition:background .15s;}
    .pbtn:hover{background:#378ADD!important;}
    .bbtn{cursor:pointer;background:none;border:none;font-family:inherit;transition:color .15s;}
    .bbtn:hover{color:#378ADD!important;}
    .flnk{cursor:pointer;background:none;border:none;font-family:inherit;transition:color .15s;}
    .flnk:hover{color:#378ADD!important;}
    .sbar::after{content:'';display:block;width:36px;height:3px;background:#378ADD;margin-top:.6rem;border-radius:2px;}
    .il-li::before{content:'▸';color:#378ADD;margin-right:.45rem;flex-shrink:0;}
    .rt{width:100%;border-collapse:collapse;font-size:.85rem;}
    .rt th{background:#042C53;color:#fff;padding:.7rem 1rem;text-align:left;font-weight:500;}
    .rt th:first-child{border-radius:8px 0 0 0;}.rt th:last-child{border-radius:0 8px 0 0;}
    .rt td{padding:.65rem .85rem;border-bottom:.5px solid #e5e7eb;}
    .mob-menu{display:none;position:absolute;top:54px;left:0;right:0;background:#042C53;flex-direction:column;gap:0;border-bottom:.5px solid rgba(55,138,221,.2);z-index:199;}
    .mob-menu.open{display:flex;}
    .mob-menu .nl{padding:.8rem 1.5rem;border-bottom:.5px solid rgba(255,255,255,.07);border-right:none;text-align:left;width:100%;}
    .tab-bar{display:flex;overflow-x:auto;-webkit-overflow-scrolling:touch;}
    .tab-bar::-webkit-scrollbar{display:none;}
    .dd-wrap .dd-menu{display:none;}
    .dd-wrap:hover .dd-menu{display:block;}

    @media(max-width:640px){
      .desktop-links{display:none!important;}
      #ham-btn{display:block!important;}
      .g2{grid-template-columns:1fr!important;}
    }
  </style>

function Icon({name,size=16,color="currentColor",style={}}){
  const d=SVGS[name]||SVGS["star"];
  return(
    <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke={color} strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" style={{flexShrink:0,...style}} aria-hidden="true">
      {d.split("M").filter(Boolean).map((seg,i)=><path key={i} d={"M"+seg}/>)}
    </svg>
  );
}

function FadeUp({children,delay=0,style={}}){
  const[vis,setVis]=useState(false);
  useEffect(()=>{const t=setTimeout(()=>setVis(true),delay);return()=>clearTimeout(t);},[delay]);
  return(
    <div style={{opacity:vis?1:0,transform:vis?"translateY(0)":"translateY(22px)",transition:`opacity .65s ease, transform .65s ease`,...style}}>
      {children}
    </div>
  );
}

function Nav({page,go}){
  const[open,setOpen]=useState(false);
  const links=[{id:"home",l:"Home"},{id:"problem",l:"Problem"},{id:"solution",l:"Our Solution",sub:[{id:"solution",tab:"overview",l:"Overview"},{id:"solution",tab:"technical",l:"Technical Details"},{id:"solution",tab:"demo",l:"Demo Video"}]},{id:"team",l:"Team"},{id:"ack",l:"Acknowledgements"}];
  const active=id=>id==="team"&&page.startsWith("member-")?true:page===id;
  const nav=id=>{go(id);setOpen(false);window.scrollTo(0,0);};
  return(
    <nav style={{position:"sticky",top:0,zIndex:200,background:C.bd,padding:"0 2rem",height:60,display:"flex",alignItems:"center",justifyContent:"space-between",borderBottom:".5px solid rgba(55,138,221,.25)"}}>
      <button style={{background:"none",border:"none",fontWeight:700,fontSize:"1.2rem",color:"#fff",letterSpacing:"-.01em",cursor:"pointer",padding:0,fontFamily:"'Space Grotesk',sans-serif"}} onClick={()=>nav("home")}>
        <span style={{color:"#fff"}}>EEG</span><em style={{fontStyle:"italic",color:"#B5D4F4"}}>rid</em>
      </button>
      <div className="desktop-links" style={{display:"flex",gap:"1.2rem",alignItems:"center"}}>
        {links.map(l=>l.sub
          ?<div key={l.id} style={{position:"relative"}} className="dd-wrap">
            <button className={`nl${active(l.id)?" on":""}`} onClick={()=>nav(l.id)} style={{display:"flex",alignItems:"center",gap:4}}>
              {l.l}<span style={{fontSize:".55rem",opacity:.7}}>▼</span>
            </button>
            <div className="dd-menu" style={{position:"absolute",top:"100%",left:"50%",transform:"translateX(-50%)",background:"#fff",borderRadius:10,boxShadow:"0 8px 32px rgba(0,0,0,.18)",padding:".5rem",minWidth:160,marginTop:6,zIndex:300}}>
              {l.sub.map(s=><button key={s.l} onClick={()=>{go(l.id);window.scrollTo(0,0);setTimeout(()=>{const el=document.querySelector(`[data-tab="${s.tab}"]`);if(el)el.click();},200);}} style={{display:"block",width:"100%",textAlign:"left",padding:".45rem .85rem",background:"none",border:"none",cursor:"pointer",borderRadius:7,fontSize:".82rem",color:"#042C53",fontWeight:500}} onMouseEnter={e=>e.target.style.background="#E6F1FB"} onMouseLeave={e=>e.target.style.background="none"}>{s.l}</button>)}
            </div>
          </div>
          :<button key={l.id} className={`nl${active(l.id)?" on":""}`} onClick={()=>nav(l.id)}>{l.l}</button>
        )}
      </div>
      <button id="ham-btn" style={{background:"none",border:"none",cursor:"pointer",color:"#fff",display:"none",padding:4}} onClick={()=>setOpen(o=>!o)}>
        <Icon name={open?"x":"menu"} size={22} color="#fff"/>
      </button>
      <div className={`mob-menu${open?" open":""}`}>
        {links.map(l=><button key={l.id} className={`nl${active(l.id)?" on":""}`} onClick={()=>nav(l.id)}>{l.l}</button>)}
      </div>
    </nav>
  );
}

function Footer({go}){
  const links=[{id:"home",l:"Home"},{id:"problem",l:"Problem"},{id:"solution",l:"Solution"},{id:"team",l:"Team"},{id:"ack",l:"Acknowledgements"}];

const UploadCtx=React.createContext(null);

function CropModal({src,onConfirm,onCancel,aspect:initAspect}){
  const[box,setBox]=useState({x:5,y:5,w:90,h:90});
  const[drag,setDrag]=useState(null);
  const[asp,setAsp]=useState(initAspect||"free");
  const conRef=useRef(null);
  const asps={"free":null,"1:1":1,"4:3":4/3,"3:4":3/4,"16:9":16/9};
  const clamp=(v,mn,mx)=>Math.max(mn,Math.min(mx,v));

  useEffect(()=>{
    const mv=e=>{
      if(!drag||!conRef.current)return;
      const r=conRef.current.getBoundingClientRect();
      const dx=(e.clientX-drag.sx)/r.width*100;
      const dy=(e.clientY-drag.sy)/r.height*100;
      let b={...drag.b};
      const ar=asps[asp];
      if(drag.t==="move"){
        b.x=clamp(b.x+dx,0,100-b.w);
        b.y=clamp(b.y+dy,0,100-b.h);
      } else {
        if(drag.t==="se"){b.w=clamp(drag.b.w+dx,10,100-b.x);b.h=ar?b.w*(r.width/r.height)/ar:clamp(drag.b.h+dy,10,100-b.y);}
        if(drag.t==="sw"){const nw=clamp(drag.b.w-dx,10,100);b.x=drag.b.x+drag.b.w-nw;b.w=nw;b.h=ar?b.w*(r.width/r.height)/ar:clamp(drag.b.h+dy,10,100-b.y);}
        if(drag.t==="ne"){b.w=clamp(drag.b.w+dx,10,100-b.x);const nh=ar?b.w*(r.width/r.height)/ar:clamp(drag.b.h-dy,10,100);b.y=drag.b.y+drag.b.h-nh;b.h=nh;}
        if(drag.t==="nw"){const nw=clamp(drag.b.w-dx,10,100);b.x=drag.b.x+drag.b.w-nw;b.w=nw;const nh=ar?b.w*(r.width/r.height)/ar:clamp(drag.b.h-dy,10,100);b.y=drag.b.y+drag.b.h-nh;b.h=nh;}
        b.x=clamp(b.x,0,100-b.w);b.y=clamp(b.y,0,100-b.h);
        b.h=clamp(b.h,10,100-b.y);b.w=clamp(b.w,10,100-b.x);
      }
      setBox(b);
    };
    const up=()=>setDrag(null);
    document.addEventListener("mousemove",mv);
    document.addEventListener("mouseup",up);
    return()=>{document.removeEventListener("mousemove",mv);document.removeEventListener("mouseup",up);};
  },[drag,asp]);

  useEffect(()=>{
    const ar=asps[asp];if(!ar||!conRef.current)return;
    const r=conRef.current.getBoundingClientRect();
    setBox(b=>({...b,h:Math.min(b.w*(r.width/r.height)/ar,100-b.y)}));
  },[asp]);

  const dn=(e,t)=>{e.preventDefault();e.stopPropagation();setDrag({t,sx:e.clientX,sy:e.clientY,b:{...box}});};
  const hSz={position:"absolute",width:12,height:12,background:"#fff",border:"2px solid #378ADD",borderRadius:2,zIndex:2};

  const confirm=()=>{
    const img=new Image();
    img.onload=()=>{
      const cv=document.createElement("canvas");
      const W=img.naturalWidth,H=img.naturalHeight;
      const x=box.x/100*W,y=box.y/100*H,w=box.w/100*W,h=box.h/100*H;
      cv.width=Math.round(w);cv.height=Math.round(h);
      cv.getContext("2d").drawImage(img,x,y,w,h,0,0,Math.round(w),Math.round(h));
      onConfirm(cv.toDataURL("image/jpeg",0.9));
    };
    img.src=src;
  };

  return(
    <div style={{position:"fixed",inset:0,background:"rgba(0,0,0,.82)",zIndex:9999,display:"flex",alignItems:"center",justifyContent:"center",padding:"1rem"}}
      onClick={e=>{if(e.target===e.currentTarget)onCancel();}}>
      <div style={{background:"#fff",borderRadius:14,padding:"1.25rem",maxWidth:"92vw",display:"flex",flexDirection:"column",gap:"1rem"}}>
        <div style={{display:"flex",alignItems:"center",justifyContent:"space-between"}}>
          <strong style={{color:"#042C53",fontSize:"1rem"}}>Crop Photo</strong>
          <button onClick={onCancel} style={{background:"none",border:"none",fontSize:"1.4rem",cursor:"pointer",color:"#9ca3af",lineHeight:1,padding:"0 4px"}}>x</button>
        </div>
        <div style={{display:"flex",gap:6,flexWrap:"wrap",alignItems:"center"}}>
          {Object.keys(asps).map(k=>(
            <button key={k} onClick={()=>setAsp(k)} style={{padding:"4px 10px",background:asp===k?"#042C53":"#f3f4f6",color:asp===k?"#fff":"#374151",borderRadius:6,border:"1px solid "+(asp===k?"#042C53":"#d1d5db"),cursor:"pointer",fontSize:".78rem",fontWeight:500}}>{k}</button>
          ))}
          <span style={{color:"#9ca3af",fontSize:".72rem",marginLeft:4}}>Drag to move/resize</span>
        </div>
        <div ref={conRef} style={{position:"relative",userSelect:"none",lineHeight:0,borderRadius:8,overflow:"hidden"}}>
          <img src={src} style={{maxWidth:"min(68vw,780px)",maxHeight:"58vh",display:"block"}}/>
          <div style={{position:"absolute",inset:0,background:"rgba(0,0,0,.52)",pointerEvents:"none"}}/>
          <div style={{position:"absolute",left:`${box.x}%`,top:`${box.y}%`,width:`${box.w}%`,height:`${box.h}%`,
            border:"2px solid #fff",cursor:"move",boxSizing:"border-box",
            backgroundImage:"linear-gradient(rgba(255,255,255,.15) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.15) 1px,transparent 1px)",
            backgroundSize:"33.33% 33.33%"}}
            onMouseDown={e=>dn(e,"move")}>
            <div style={{...hSz,top:-6,left:-6,cursor:"nw-resize"}} onMouseDown={e=>dn(e,"nw")}/>
            <div style={{...hSz,top:-6,right:-6,cursor:"ne-resize"}} onMouseDown={e=>dn(e,"ne")}/>
            <div style={{...hSz,bottom:-6,left:-6,cursor:"sw-resize"}} onMouseDown={e=>dn(e,"sw")}/>
            <div style={{...hSz,bottom:-6,right:-6,cursor:"se-resize"}} onMouseDown={e=>dn(e,"se")}/>
          </div>
        </div>
        <div style={{display:"flex",gap:8,justifyContent:"flex-end"}}>
          <button onClick={onCancel} style={{padding:"8px 18px",background:"#f3f4f6",border:"1px solid #d1d5db",borderRadius:8,cursor:"pointer",fontSize:".875rem"}}>Cancel</button>
          <button onClick={confirm} style={{padding:"8px 18px",background:"#042C53",color:"#fff",border:"none",borderRadius:8,cursor:"pointer",fontSize:".875rem",fontWeight:500}}>Use This Crop</button>
        </div>
      </div>
    </div>
  );
}

function UploadProvider({children}){
  const[imgs,setImgs]=useState({});
  const[modal,setModal]=useState(null);
  const fileRef=useRef(null);
  const pending=useRef({});

  const open=(id,aspect)=>{
    pending.current={id,aspect};
    fileRef.current.click();
  };

  const onFile=e=>{
    const file=e.target.files[0];
    if(!file){return;}
    e.target.value="";
    const reader=new FileReader();
    reader.onload=ev=>setModal({id:pending.current.id,src:ev.target.result,aspect:pending.current.aspect});
    reader.readAsDataURL(file);
  };

  const onConfirm=b64=>{
    setImgs(p=>({...p,[modal.id]:b64}));
    setModal(null);
  };

  return(
    <UploadCtx.Provider value={{imgs,open}}>
      <input ref={fileRef} type="file" accept="image/*" style={{display:"none"}} onChange={onFile}/>
      {modal&&<CropModal src={modal.src} aspect={modal.aspect} onConfirm={onConfirm} onCancel={()=>setModal(null)}/>}
      {children}
    </UploadCtx.Provider>
  );
}

function ProblemPage(){
  return(
    <>
      <PH2 title="Problem Statement" sub="Understanding the clinical need that EEGrid was designed to address"/>
      <SEC>
        <SH label="Background & Motivation" title="Why Does This Matter?"/>
        <p style={{color:"#6b7280",fontSize:".975rem",lineHeight:1.75,marginBottom:".8rem"}}>Electroencephalography (EEG) measures brain electrical activity non-invasively by placing electrodes on the scalp, capturing event-related potentials (ERPs) that are critical for assessing cognitive function, diagnosing neurological conditions, and enabling brain-computer interface (BCI) research. Despite its clinical importance, EEG adoption remains limited by a fundamental trade-off between two electrode paradigms.</p>
        <p style={{color:"#6b7280",fontSize:".975rem",lineHeight:1.75,marginBottom:".8rem"}}>Wet gel electrodes (Ag/AgCl) deliver superior signal quality but require up to 45 minutes of setup, messy conductive gels, and post-session hair cleaning. Dry electrodes offer fast, gel-free setup but suffer from high input impedance (>1 MΩ) and noise artifacts from sweat and motion. Neither system is well-suited to the 10,000–100,000 potential users in academic, educational, and hobbyist settings who require both fidelity and practicality.</p>
        <p style={{color:"#6b7280",fontSize:".975rem",lineHeight:1.75,margin:0}}>Current commercial high-fidelity EEG systems -- such as the CGX Quick-20 and Biosemi Active Two -- cost $10,000–$30,000 and come in fixed head sizes, requiring labs to purchase multiple headsets to accommodate different subjects. This financial barrier effectively excludes student research groups, independent researchers, and educators from accessing high-density EEG technology.</p>
        <G3>
          <KCard icon="chart-bar" title="Scale of the Problem" text="Commercial EEG systems cost $10,000–$30,000. The estimated addressable market of independent researchers, student labs, hobbyists, and educators is between 10,000 and 100,000 potential users currently priced out of the technology."/>
          <KCard icon="alert-triangle" title="Limitations of Current Solutions" text="Wet EEG requires 30–45 minutes of setup and conductive gel. Dry EEG has high impedance (>1 MΩ) and noise artifacts. Both use fixed-size caps that cannot be reconfigured for different head sizes or electrode paradigms."/>
          <KCard icon="building" title="Clinical Setting" text="EEGrid targets research labs, university classrooms, and maker/hobbyist environments. It is designed for short-to-medium duration EEG studies (30–60 minutes) requiring event-related potential (ERP) recordings such as P300, VEP, and alpha-suppression paradigms."/>
        </G3>
      </SEC>
      <HR/>
      <SEC>
        <SH label="Formal Problem Statement" title="The Challenge We're Solving"/>
        <blockquote style={{background:C.bx,borderLeft:`4px solid ${C.ba}`,borderRadius:"0 8px 8px 0",padding:"1.1rem 1.4rem",fontStyle:"italic",color:C.bm,fontSize:".9rem",marginBottom:"1.1rem",marginLeft:0,marginRight:0}}>
          "Current EEG systems present an unresolved trade-off between signal quality and usability, compounded by costs exceeding $10,000 and fixed electrode configurations that limit accessibility. There is a need for a low-cost, modular EEG headset with semi-dry electrodes that achieves clinical-grade impedance (≤30 kΩ), adapts to different head sizes and paradigms, and can be reproduced for under $400."
        </blockquote>
        <p style={{color:"#6b7280",fontSize:".975rem",lineHeight:1.75,margin:0}}>The core engineering challenge is achieving low input impedance without the mess and setup burden of traditional wet systems. A viable solution must maintain stable scalp contact through hair, sustain low impedance over a full recording session (~30–60 minutes), fit a range of head sizes without requiring multiple fixed caps, and be manufacturable at a cost accessible to non-clinical users. EEGrid addresses all four requirements simultaneously through a hybrid hydrogel-comb electrode design and a fully modular 3D-printed mechanical architecture.</p>
      </SEC>
      <HR/>
      <SEC>
        <SH label="Engineering Requirements" title="Design Constraints & Specifications"/>
        <p style={{color:"#6b7280",fontSize:".975rem",lineHeight:1.75}}>[Describe the key design requirements -- performance specs, safety/regulatory constraints, cost targets, usability requirements.]</p>
        <IL items={['Effective contact impedance (ECI) ≤ 30 kΩ at the skin-electrode interface (per IEC 60601-2-26)','Total system manufacturing cost ≤ $400 (hydrogel electrodes ≤ $15 for an 8-pack)','Headset setup time ≤ 15 minutes; adjustable to fit head circumferences of 52–60 cm and nasion–inion distances of 33–39 cm','All components must be biocompatible (ISO 10993-1) and electrically safe (IEC 60601-1)']}/>
      </SEC>
      <HR/>
      <SEC>
        <SH label="Broader Implications" title="Global Impact & Ethics"/>
        <G2>
          <p style={{color:"#6b7280",fontSize:".975rem",lineHeight:1.75,margin:0}}>EEGrid's open-source, low-cost design has the potential to democratize EEG technology far beyond university research labs. By eliminating the $10,000+ cost barrier and removing the need for conductive gel or professional technician setup, EEGrid can enable neurological screening in rural US clinics, community health centers, and low-resource international settings where EEG has historically been inaccessible. In the longer term, validated open-source neurotechnology can support global neuroscience education, reduce disparities in epilepsy diagnosis, and serve as a platform for citizen-science BCI research.</p>
          <p style={{color:"#6b7280",fontSize:".975rem",lineHeight:1.75,margin:0}}>Neural data raises important privacy concerns: brain activity can reveal cognitive states, health conditions, and behavioral patterns. EEGrid's team has documented risks around data ownership, informed consent, and potential misuse for behavioral profiling or surveillance. All hydrogel materials must pass biocompatibility testing (ISO 10993-1) before use on human subjects. The open-source nature of the design also raises IP considerations around responsible sharing.</p>
        </G2>
      </SEC>
      <PageCredit name="Megan Liem"/>
    </>
  );
}

              <p style={{color:"#6b7280",fontSize:".975rem",lineHeight:1.75,margin:0}}>Unlike existing semi-dry electrodes that use rigid substrates with hydrogel tips, EEGrid's electrode is constructed entirely from hydrogel -- eliminating the substrate-hydrogel interface and enabling the comb prongs themselves to be conductive. At under $250 total system cost, EEGrid achieves a >95% cost reduction relative to comparable commercial systems.</p>

  2:{bio:"Rohan is a Bioengineering student at UC San Diego with an interest in neuroengineering and surgical robotics. He served as Team Lead for EEGrid, coordinating between subsystems while contributing directly to the mechanical design of the electrode housing.",exp:["Neurosciences Researcher, Graves Neuroimmunology Research Group","Certified for clinical trial use of Advanced Brain Monitoring StatX24 EEG","Trained for clinical trial use of the Wearable Sensing DSI VR-300 and DSI VR-VEP"],contribs:[{icon:"settings",title:"Electrode Housing Design",text:"Designed the 4-DOF quasi-spherical electrode housing in CAD, incorporating yaw rotation, axial compression via TPU spring, and pitch/roll compliance for consistent scalp contact."},{icon:"puzzle",title:"Hydrogel Mold Design",text:"Collaboratively designed the hydrogel electrode mold in CAD, ensuring the three-pronged comb geometry translated accurately from concept to fabrication."},{icon:"star",title:"Team Coordination",text:"Bridged the mechanical and materials subsystems, keeping design iterations aligned with team goals, advisor feedback, and the DEBUT competition timeline."}],reflections:["Bridged the mechanical components of the modular headset and the hydrogel electrode, designing the electrode housing in CAD and collaboratively designing the hydrogel mold based on teammates feedback.","Gained practical experience translating research-grade neurotechnology concepts into manufacturable, reproducible hardware designs."],photo:"data:image/jpeg;base64,/9j/4AAQSkZJRgABAQAAAQABAAD/2wBDAAQDAwMDAgQDAwMEBAQFBgoGBgUFBgwICQcKDgwPDg4MDQ0PERYTDxAVEQ0NExoTFRcYGRkZDxIbHRsYHRYYGRj/2wBDAQQEBAYFBgsGBgsYEA0QGBgYGBgYGBgYGBgYGBgYGBgYGBgYGBgYGBgYGBgYGBgYGBgYGBgYGBgYGBgYGBgYGBj/wAARCAFAARgDASIAAhEBAxEB/8QAHwAAAQUBAQEBAQEAAAAAAAAAAAECAwQFBgcICQoL/8QAtRAAAgEDAwIEAwUFBAQAAAF9AQIDAAQRBRIhMUEGE1FhByJxFDKBkaEII0KxwRVS0fAkM2JyggkKFhcYGRolJicoKSo0NTY3ODk6Q0RFRkdISUpTVFVWV1hZWmNkZWZnaGlqc3R1dnd4eXqDhIWGh4iJipKTlJWWl5iZmqKjpKWmp6ipqrKztLW   3:{bio:"Megan is a Bioengineering student at UC San Diego with interests in neuroengineering, brain-computer interfaces, and the systems integration side of medical device development. Her work on EEGrid focused on signal validation, documentation, and systems-level oversight.",exp:["Neuroengineering Validation Intern, Wearable Sensing","BENG 199 Research Rotation, Swartz Center for Computational Neuroscience (SCCN)"],contribs:[{icon:"wave-sine",title:"EEG Signal Validation",text:"Conducted EEG signal validation experiments, running Welch PSD analysis and artifact rejection pipelines in MATLAB/EEGLAB to establish baseline performance benchmarks."},{icon:"file-text",title:"Documentation & Regulatory",text:"Led technical report writing covering ISO 10993-1, ISO 14971, IEC 60601-1, and FMEA, and coordinated the DEBUT competition video script and submission materials."},{icon:"layout-grid",title:"Systems Integration",text:"Oversaw systems-level integration across subsystems, ensuring design traceability between the hydrogel electrode, PCB, and headset frame."}],reflections:["This project deepened my understanding of how hardware, materials, and software constraints interact at the system level in a real medical device.","I gained hands-on experience translating regulatory frameworks (IEC 60601, ISO 10993) into practical design decisions and documenting iterative prototype development."],photo:"data:image/jpeg;base64,/9j/4AAQSkZJRgABAQAAAQABAAD/2wBDAAcFBQYFBAcGBgYIBwcICxILCwoKCxYPEA0SGhYbGhkWGRgcICgiHB4mHhgZIzAkJiorLS4tGyIyNTEsNSgsLSz/2wBDAQcICAsJCxULCxUsHRkdLCwsLCwsLCwsLCwsLCwsLCwsLCwsLCwsLCwsLCwsLCwsLCwsLCwsLCwsLCwsLCwsLCz/wAARCAFeARgDASIAAhEBAxEB/8QAHwAAAQUBAQEBAQEAAAAAAAAAAAECAwQFBgcICQoL/8QAtRAAAgEDAwIEAwUFBAQAAAF9AQIDAAQRBRIhMUEGE1FhByJxFDKBkaEII0KxwRVS0fAkM2JyggkKFhcYGRolJicoKSo0NTY3ODk6Q0RFRkdISUpTVFVWV1hZWmNkZWZnaGlqc3R1dnd4eXqDhIWGh4iJipKTlJWWl5iZmqKjpKWmp6ipqrKztLW2t7i5usLDxMXGx8jJytLT1NXW19jZ2uHi4+Tl5ufo6erx8vP09fb3+Pn6/8QAHwEAAwEBAQEBAQEBAQAAAAAAAAECAwQFBg   4:{bio:"TJ is a Bioengineering:Biosystems student at UC San Diego with a focused interest in neural interfaces, assistive technology, and neurotechnology. Core technical areas include physiological signal acquisition and processing (EEG, EMG), analog circuit design, and PCB development.",exp:[],contribs:[{icon:"cpu",title:"Signal Acquisition Hardware",text:"Developed and validated the signal acquisition hardware, including PCB design and testing, to ensure accurate and reliable biosensor data collection."},{icon:"activity",title:"Fit Testing",text:"Fitted participants with the EEGrid headset during human subject testing sessions, evaluating comfort, electrode contact, and signal quality."},{icon:"bolt",title:"Industry Collaboration",text:"Engaged with professionals at CGX and Wearable Sensing for feedback on electronic design considerations and refined the acquisition system accordingly."}],reflections:["This project provided me with invaluable hands-on experience fitting participants with wearable neurotechnology. I met with industry professionals at CGX and Wearable Sensing to understand key electronic design considerations.","Their industry perspectives paired with mentorship from Professor Gert Cauwenberghs provided the support to successfully develop the electronics system alongside my colleague Jose."],photo:"data:image/jpeg;base64,/9j/4AAQSkZJRgABAQAAAQABAAD/2wBDAAcFBQYFBAcGBgYIBwcICxILCwoKCxYPEA0SGhYbGhkWGRgcICgiHB4mHhgZIzAkJiorLS4tGyIyNTEsNSgsLSz/2wBDAQcICAsJCxULCxUsHRkdLCwsLCwsLCwsLCwsLCwsLCwsLCwsLCwsLCwsLCwsLCwsLCwsLCwsLCwsLCwsLCwsLCz/wAARCAFeARgDASIAAhEBAxEB/8QAHwAAAQUBAQEBAQEAAAAAAAAAAAECAwQFBgcICQoL/8QAtRAAAgEDAwIEAwUFBAQAAAF9AQIDAAQRBRIhMUEGE1FhByJxFDKBkaEII0KxwRVS0fAkM2JyggkKFhcYGRolJicoKSo0NTY3ODk6Q0RFRkdISUpTVFVWV1hZWmNkZWZnaGlqc3R1dnd4eXqDhIWGh4iJipKTlJWWl5iZmqKjpKWmp6ipqrKztLW2t7i5usLDxMXGx8jJytLT1NXW19jZ2uHi4+Tl5ufo6erx8vP09fb3+Pn6/8QAHwEAAwEBAQEBAQEBAQAAAAAAAAECAwQFBgcICQoL/8QAtREAAgECBAQDBAcFBAQAAQJ3AAECAxEEBSExBhJBUQdhcRMiMoEIFEKRobHBCSMzUv   5:{bio:"Cheryl is a Bioengineering student at UC San Diego with an interest in the mental health applications of neurotechnology -- including how EEG can be used to better understand brain activity and support future approaches to mental health monitoring and treatment.",exp:["Undergraduate Researcher, Functional Neuroscience Lab (UCSD Department of Psychiatry)","Undergraduate Clinical Research Intern, Cognitive Assessment and Risk Evaluation Program (UCSD Department of Psychiatry)"],contribs:[{icon:"settings",title:"Headset Prototyping",text:"Prototyped and fabricated the adjustable headset components for the modular EEG system, iterating on PLA and TPU designs through multiple print cycles."},{icon:"adjustments",title:"CAD & 3D Printing",text:"Gained hands-on experience with CAD modeling and 3D printing with diverse materials including TPU for flexible straps and PLA for rigid electrode holders."},{icon:"puzzle",title:"Project Management",text:"Managed project timelines, team deliverables, and meeting coordination throughout the BENG 187 year, keeping the project on track across all subsystems."}],reflections:["Gained practical experience with CAD modeling, 3D printing with different materials such as TPU, and iterative prototype development.","Developed a deeper appreciation for how mechanical design constraints interact with the clinical performance requirements of a wearable EEG system."],photo:"data:image/jpeg;base64,/9j/4AAQSkZJRgABAQAAAQABAAD/2wBDAAcFBQYFBAcGBgYIBwcICxILCwoKCxYPEA0SGhYbGhkWGRgcICgiHB4mHhgZIzAkJiorLS4tGyIyNTEsNSgsLSz/2wBDAQcICAsJCxULCxUsHRkdLCwsLCwsLCwsLCwsLCwsLCwsLCwsLCwsLCwsLCwsLCwsLCwsLCwsLCwsLCwsLCwsLCz/wAARCAFeARgDASIAAhEBAxEB/8QAHwAAAQUBAQEBAQEAAAAAAAAAAAECAwQFBgcICQoL/8QAtRAAAgEDAwIEAwUFBAQAAAF9AQIDAAQRBRIhMUEGE1FhByJxFDKBkaEII0KxwRVS0fAkM2JyggkKFhcYGRolJicoKSo0NTY3ODk6Q0RFRkdISUpTVFVWV1hZWmNkZWZnaGlqc3R1dnd4eXqDhIWGh4iJipKTlJWWl5iZmqKjpKWmp6ipqrKztLW2t7i5usLDxMXGx8jJytLT1NXW19jZ2uHi4+Tl5ufo6erx8vP09fb3+Pn6/8QAHwEAAwEBAQEBAQEBAQAAAAA function MemberPage({id,go}){
  const mob=useIsMob();
  const ctx=React.useContext(UploadCtx);
  const m=MEMBERS.find(x=>x.id===id)||MEMBERS[0];
  const d=MEMBERS_DATA[id]||{};
  return(
    <>
      <div style={{background:C.bd,padding:mob?"2rem 1.25rem":"2.75rem 1.75rem"}}>
        <div style={{maxWidth:1020,margin:"0 auto",display:"flex",flexDirection:mob?"column":"row",alignItems:mob?"flex-start":"center",gap:mob?"1rem":"1.75rem"}}>
          {(()=>{const tp=ctx&&ctx.imgs&&ctx.imgs[`team-${m.id}`];const src=tp||d.photo;return src?<img src={src} alt={m.name} style={{width:mob?72:90,height:mob?72:90,borderRadius:"50%",objectFit:"cover",flexShrink:0,border:"2px solid rgba(55,138,221,.4)",cursor:"pointer"}} onClick={()=>ctx&&ctx.open(`team-${m.id}`,"1:1")} title="Click to change photo"/>:<div style={{width:mob?72:90,height:mob?72:90,borderRadius:"50%",background:m.bg,flexShrink:0,display:"flex",alignItems:"center",justifyContent:"center",fontWeight:500,fontSize:mob?"1.3rem":"1.6rem",color:"#fff",cursor:"pointer"}} onClick={()=>ctx&&ctx.open(`team-${m.id}`,"1:1")} title="Upload photo">{m.init}</div>;})()}
          <div>
            <h1 style={{fontSize:mob?"1.35rem":"clamp(1.35rem,3.5vw,1.85rem)",fontWeight:500,color:"#fff",letterSpacing:"-.03em",marginBottom:".25rem",marginTop:0}}>{m.name}</h1>
            <p style={{color:C.ba,fontSize:".975rem",fontWeight:500,margin:0}}>{m.role}</p>
            <p style={{color:"rgba(255,255,255,.38)",fontSize:".78rem",marginTop:".15rem",marginBottom:0}}>{"B.S. Bioengineering, UC San Diego · Class of 2026"}</p>
          </div>
        </div>
      </div>
      <SEC>
        <SH label="About Me" title="Background & Interests"/>
        <G2>
          <div>
            <p style={{color:"#6b7280",fontSize:".975rem",lineHeight:1.75,marginBottom:"1rem"}}>{d.bio||""}</p>
            {d.exp&&d.exp.length>0&&(<div style={{background:C.bx,borderRadius:12,padding:"1rem 1.2rem"}}>
              <p style={{fontSize:".63rem",fontWeight:500,letterSpacing:".15em",textTransform:"uppercase",color:C.ba,marginBottom:".5rem",marginTop:0}}>Relevant Experience</p>
              <IL items={d.exp}/>
            </div>)}
          </div>
          {d.photo
            ?<img src={d.photo} alt={m.name} style={{width:"100%",maxWidth:320,borderRadius:14,objectFit:"cover",aspectRatio:"3/4",justifySelf:"center",border:".5px solid #e5e7eb"}}/>
            :<PH icon="camera" title="Photo" sub="Photo coming soon" h={260}/>
          }
        </G2>
      </SEC>
      <HR/>
      <SEC>
        <SH label="Reflection" title="What I Learned"/>
        <IL items={d.reflections||[]}/>
      </SEC>
      <HR/>
      <section style={{padding:"1.25rem 1.25rem 2.25rem",maxWidth:1020,margin:"0 auto"}}>
        <button className="bbtn" style={{color:C.bb,fontSize:".85rem",fontWeight:500,display:"inline-flex",alignItems:"center",gap:5}} onClick={()=>{go("team");window.scrollTo(0,0);}}>
          <Icon name="arrow-left" size={13} color={C.bb}/> Back to Team
        </button>
      </section>
      <PageCredit name={m.name}/>
    </>
  );
}

function AckPage(){
  return(
    <>
      <PH2 title="Acknowledgements" sub="We are grateful to the people and organizations that made EEGrid possible"/>
      <SEC>
        <SH label="Faculty Advisors" title="Research Mentors"/>
        <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fit,minmax(220px,1fr))",gap:"1rem",marginTop:"1.5rem"}}>
          <KCard icon="star" title="Dr. Gert Cauwenberghs" text="Professor, Bioengineering & Neurosciences, UC San Diego. Provided foundational guidance on EEG circuit design, electrode architecture, and accessible neurotechnology."/>
          <KCard icon="star" title="Dr. Tzyy-Ping Jung" text="Research Scientist, SCCN, UC San Diego. Provided critical expertise in EEG signal processing and BCI, supporting the team's experimental validation."/>
          <KCard icon="flask-conical" title="Yuhong Zhang, MS" text="PhD Student, SCCN, UC San Diego. Gave advice for the initial conception of the project."/>
        </div>
      </SEC>
      <HR/>
      <SEC>
        <SH label="Course Instructors" title="Senior Design Teaching Team"/>
        <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fit,minmax(220px,1fr))",gap:"1rem",marginTop:"1.5rem"}}>
          <KCard icon="star" title="Dr. Taylor" text="BENG 187 Senior Design Instructor. Provided essential technical and logistical guidance throughout the course timeline."/>
          <KCard icon="star" title="Iris Zaretzki" text="BENG 187 Teaching Assistant. Offered consistent support and feedback throughout the design and prototyping process."/>
        </div>
      </SEC>
      <SEC>
        <SH label="External Support" title="Consultants & Collaborators"/>
        <IL items={["Eduard Deneke and Spencer Linton, CGX, LLC — design consultation and continued advisory support.","Design and Innovation Makerspace (DIB), UC San Diego — 3D printing and PCB testing resources.","Dr. Tamoghna Saha, NanoBioElectronics Lab (Wang Lab), UC San Diego — wet lab access and mentorship for hydrogel synthesis.","Ryan Hanson, Wearable Sensing — industry consultation on EEG signal acquisition."]}/>
      </SEC>
      <HR/>
      <SEC>
        <SH label="References" title="Citations & Sources"/>
        <div style={{display:"flex",flexDirection:"column",gap:10}}>
          {["[1] Olejniczak, P. Neurophysiologic Basis of EEG. J. Clin. Neurophysiol., 23(3), 2006.","[2] Hsieh, J. et al. Hydrogel-Based Wearable EEG Electrodes. J. Mater. Chem. B, 2022.","[3] Kalevo, L. et al. Electrode-Skin Contact Impedances. IEEE Access, 2020.","[4] Ferree, T.C. et al. Scalp electrode impedance and EEG quality. Clin. Neurophysiol., 2001.","[5] Li, Y. et al. EEG-based BCI via PEDOT:PSS. Matter, 2024.","[6] Peter, K. et al. Flexible EEG headset. US Patent 12,171,566 B2, 2024.","[7] Liu, J. & Shen, G. Hydrogel electrode for EEG. CN112450938A, 2021.","[8] Wingeier, B. et al. Electrode system for stimulation. US Patent 11,123,544 B2, 2021."].map((r,i)=>(
            <div key={i} style={{padding:".75rem 1rem",background:"#fff",border:".5px solid #e5e7eb",borderRadius:8,fontSize:".83rem",color:"#6b7280"}}>{r}</div>
          ))}
        </div>
      </SEC>
      <PageCredit name="Rohan Kumar"/>
    </>
  );
}


function App(){
  const[page,setPage]=useState("home");
  const go=p=>{setPage(p);window.scrollTo({top:0,behavior:"smooth"});};
  const mid=page.startsWith("member-")?parseInt(page.split("-")[1]):null;
  return(
    <UploadProvider><div style={{minHeight:"100vh",display:"flex",flexDirection:"column",background:"#f9fafb",fontFamily:"system-ui,-apple-system,sans-serif",fontSize:"16px"}}>
      <Nav page={page} go={go}/>
      <main style={{flex:1}}>
        {page==="home"&&<HomePage go={go}/>}
        {page==="problem"&&<ProblemPage/>}
        {page==="solution"&&<SolutionPage/>}
        {page==="team"&&<TeamPage go={go}/>}
        {mid!==null&&<MemberPage id={mid} go={go}/>}
        {page==="ack"&&<AckPage/>}
      </main>
      <Footer go={go}/>
    </div></UploadProvider>
  );
}

ReactDOM.render(<App/>,document.getElementById("root"));
</script>
</body>
